<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2B211C;--muted:#6E6259;--bg:#FFFDF9;--line:#EFE9E0}
  body{margin:0;background:var(--bg);font-family:Prompt,sans-serif;color:var(--ink)}
  .wrap{max-width:430px;margin:0 auto;padding:14px 14px 30px}
  h1{font-family:Mitr,sans-serif;font-weight:500;font-size:20px;margin:4px 2px 10px}
  .seg{display:flex;gap:6px;margin:0 0 10px}
  .seg button{flex:1;border:0;border-radius:999px;background:#F6F1EA;font:inherit;font-size:13px;padding:8px 0;color:var(--muted)}
  .seg button.on{background:#FFB020;color:var(--ink);font-weight:600}
  #map{height:430px;border-radius:22px;overflow:hidden;box-shadow:0 2px 10px rgba(43,33,28,.08)}
  .pin{width:28px;height:28px;border-radius:999px;color:#fff;font:600 13px Prompt,sans-serif;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  ol{list-style:none;padding:0;margin:12px 0 0}
  li{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-size:14px}
  li .pin{width:24px;height:24px;font-size:12px;border-width:0;box-shadow:none;flex:none}
  li small{color:var(--muted);font-size:12px;margin-left:auto}
  .leg{color:var(--muted);font-size:12px;padding-left:34px;min-height:26px;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>แผนที่วันที่ 25 พ.ย.</h1>
  <div class="seg"><button data-s="positron">โทนอ่อน</button><button data-s="middle" class="on">กลางๆ</button><button data-s="liberty">สีสด</button></div>
  <div id="map"></div>
  <ol id="list"></ol>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const STOPS = [
  {n:"Shinagawa Prince Hotel", k:"stay", ll:[35.6282,139.7365]},
  {n:"Tokyo Tower", k:"place", ll:[35.6586,139.7454]},
  {n:"Zojoji Temple", k:"place", ll:[35.6574,139.7480]},
  {n:"Ichiran Shibuya", k:"food", ll:[35.6614,139.7010]},
  {n:"Shibuya Sky", k:"place", ll:[35.6585,139.7024]},
  {n:"Blue Bottle Shibuya", k:"cafe", ll:[35.6619,139.6978]}
];
const MODE = ["รถไฟ · 18 นาที","เดิน · 5 นาที","รถไฟ · 22 นาที","เดิน · 6 นาที","เดิน · 7 นาที"];
const COLOR = {stay:"#7B5BA6",place:"#3E9B3C",food:"#D4891C",cafe:"#A86A3D"};
const STYLES = {
  positron:"https://tiles.openfreemap.org/styles/positron",
  liberty:"https://tiles.openfreemap.org/styles/liberty",
  osm:{version:8,sources:{o:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap"}},layers:[{id:"o",type:"raster",source:"o"}]}
};
/* "กลางๆ": the colourful style with softer roads, water and parks */
async function middleStyle(){
  const st = await (await fetch(STYLES.liberty)).json();
  const soft = {motorway:"#F6CF8E", trunk:"#F8DCA6", primary:"#FBE7BF", secondary:"#FDF0D3", tertiary:"#FFFFFF"};
  for(const l of st.layers){ const id = l.id, p = l.paint || (l.paint = {});
    if(l.type === "line" && /road|highway|bridge|tunnel/.test(id) && !/casing|outline|rail|path|pedestrian/.test(id)){
      const k = Object.keys(soft).find(k => id.includes(k)); if(k) p["line-color"] = soft[k]; }
    if(/water/.test(id) && l.type === "fill") p["fill-color"] = "#CFE3F2";
    if(/water/.test(id) && l.type === "line") p["line-color"] = "#CFE3F2";
    if(/park|landuse_park|wood|grass/.test(id) && l.type === "fill") p["fill-color"] = "#E3EFD9";
    if(id === "background") p["background-color"] = "#F7F5F1";
  }
  return st;
}
const map = new maplibregl.Map({container:"map",style:STYLES.positron,bounds:new maplibregl.LngLatBounds(STOPS.map(s=>[s.ll[1],s.ll[0]])),fitBoundsOptions:{padding:40},attributionControl:{compact:true}});
let lines = [];
async function routes(){ lines=[]; for(let i=0;i<STOPS.length-1;i++){ const a=STOPS[i].ll,b=STOPS[i+1].ll, walk=/เดิน/.test(MODE[i]);
  try{ const r=await (await fetch(`https://router.project-osrm.org/route/v1/${walk?"foot":"driving"}/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)).json(); lines.push({walk,coords:r.routes[0].geometry.coordinates}); }
  catch(e){ lines.push({walk,coords:[[a[1],a[0]],[b[1],b[0]]]}); } } }
function draw(){ lines.forEach((l,i)=>{ const id="r"+i; if(map.getSource(id)) return; if(!map.isStyleLoaded()) return;
  map.addSource(id,{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:l.coords}}});
  map.addLayer({id,type:"line",source:id,layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#2B61B2","line-width":5,"line-opacity":.85,...(l.walk?{"line-dasharray":[0.2,2]}:{})}}); }); }
const ready = routes();
map.on("style.load", async () => { await ready; draw(); });
STOPS.forEach((s,i)=>{ const el=document.createElement("div"); el.className="pin"; el.style.background=COLOR[s.k]; el.textContent=s.k==="stay"?"⌂":i; new maplibregl.Marker({element:el}).setLngLat([s.ll[1],s.ll[0]]).setPopup(new maplibregl.Popup({offset:16,closeButton:false}).setText(s.n)).addTo(map); });
map.once("load", async () => map.setStyle(await middleStyle()));
document.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{ map.setStyle(b.dataset.s === "middle" ? await middleStyle() : STYLES[b.dataset.s]); document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b)); });
document.getElementById("list").innerHTML = STOPS.map((s,i)=>`<li><span class="pin" style="background:${COLOR[s.k]}">${s.k==="stay"?"⌂":i}</span>${s.n}</li>${MODE[i]?`<li class="leg">${MODE[i]}</li>`:""}`).join("");
</script>
</body>
</html>
