<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2B211C;--muted:#6E6259;--bg:#FFFDF9;--line:#EFE9E0}
  body{margin:0;background:var(--bg);font-family:Prompt,sans-serif;color:var(--ink)}
  .wrap{max-width:430px;margin:0 auto;padding:14px 14px 30px}
  h1{font-family:Mitr,sans-serif;font-weight:500;font-size:20px;margin:4px 2px 10px}
  .seg{display:flex;gap:6px;margin:0 0 10px}
  .seg button{flex:1;border:0;border-radius:999px;background:#F6F1EA;font:inherit;font-size:13px;padding:8px 0;color:var(--muted)}
  .seg button.on{background:#FFB020;color:var(--ink);font-weight:600}
  #map{height:430px;border-radius:22px;overflow:hidden;box-shadow:0 2px 10px rgba(43,33,28,.08)}
  .pin{width:28px;height:28px;border-radius:999px;color:#fff;font:600 13px Prompt,sans-serif;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  ol{list-style:none;padding:0;margin:12px 0 0}
  li{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-size:14px}
  li .pin{width:24px;height:24px;font-size:12px;border-width:0;box-shadow:none;flex:none}
  li small{color:var(--muted);font-size:12px;margin-left:auto}
  .leg{color:var(--muted);font-size:12px;padding-left:34px;min-height:26px;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>แผนที่วันที่ 25 พ.ย.</h1>
  <div class="seg"><button data-s="voyager" class="on">แบบสะอาด</button><button data-s="osm">OpenStreetMap</button><button data-s="light">โทนอ่อน</button></div>
  <div id="map"></div>
  <ol id="list"></ol>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STOPS = [
  {n:"Shinagawa Prince Hotel", k:"stay", ll:[35.6282,139.7365]},
  {n:"Tokyo Tower", k:"place", ll:[35.6586,139.7454]},
  {n:"Zojoji Temple", k:"place", ll:[35.6574,139.7480]},
  {n:"Ichiran Shibuya", k:"food", ll:[35.6614,139.7010]},
  {n:"Shibuya Sky", k:"place", ll:[35.6585,139.7024]},
  {n:"Blue Bottle Shibuya", k:"cafe", ll:[35.6619,139.6978]}
];
const MODE = ["รถไฟ · 18 นาที","เดิน · 5 นาที","รถไฟ · 22 นาที","เดิน · 6 นาที","เดิน · 7 นาที"];
const COLOR = {stay:"#7B5BA6",place:"#3E9B3C",food:"#D4891C",cafe:"#A86A3D"};
const TILES = {
  voyager:["https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png","© OpenStreetMap © CARTO"],
  osm:["https://tile.openstreetmap.org/{z}/{x}/{y}.png","© OpenStreetMap"],
  light:["https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png","© OpenStreetMap © CARTO"]
};
const map = L.map("map",{zoomControl:false,attributionControl:true});
let layer = null;
function tiles(k){ if(layer) map.removeLayer(layer); layer = L.tileLayer(TILES[k][0],{attribution:TILES[k][1],maxZoom:19,subdomains:"abcd"}).addTo(map);
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.s===k)); }
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>tiles(b.dataset.s));
tiles("voyager");
const icon = (i,s) => L.divIcon({className:"",html:`<div class="pin" style="background:${COLOR[s.k]}">${s.k==="stay"?"⌂":i}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
STOPS.forEach((s,i)=>L.marker(s.ll,{icon:icon(i,s)}).addTo(map).bindTooltip(s.n));
map.fitBounds(STOPS.map(s=>s.ll),{padding:[34,34]});
// route along real roads for the demo (the app would use the route Google already found for each leg)
(async()=>{ for(let i=0;i<STOPS.length-1;i++){ const a=STOPS[i].ll,b=STOPS[i+1].ll, walk=/เดิน/.test(MODE[i]);
  try{ const r=await (await fetch(`https://router.project-osrm.org/route/v1/${walk?"foot":"driving"}/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)).json();
    const line=r.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    L.polyline(line,{color:"#2B61B2",weight:5,opacity:.85,dashArray:walk?"2 8":null,lineCap:"round"}).addTo(map);
  }catch(e){ L.polyline([a,b],{color:"#2B61B2",weight:4,opacity:.6,dashArray:"6 8"}).addTo(map); } } })();
document.getElementById("list").innerHTML = STOPS.map((s,i)=>`<li><span class="pin" style="background:${COLOR[s.k]}">${s.k==="stay"?"⌂":i}</span>${s.n}</li>${MODE[i]?`<li class="leg">${MODE[i]}</li>`:""}`).join("");
</script>
</body>
</html>
