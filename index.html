<html lang="th">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: one centred phone column; each screen is a stack of white cards on a soft grey ground, one yellow accent for primary actions */
:root{
  --bg:#FFFDF9; --surface:#FFFFFF; --tile:#F6F1EA; --ink:#2B211C; --muted:#6E6259; --line:#EFE9E0; --lift:0 1px 3px rgba(43,33,28,.08);
  --accent:#FFB020; --accent-soft:#FFF1CC; --accent-line:#E39400; --warn-bg:#FFF1CC; --on-accent:#2B211C; --danger:#E0352B;
  --flight:#1958BD; --flight-soft:#E3EEFF; --flight-mid:#2F80FF;
  --stay:#8A5300; --stay-soft:#FFF1CC; --stay-mid:#FFB020;
  --place:#2B7A1C; --place-soft:#E2F6D6; --place-mid:#3FB02A;
  --move:#C23B1C; --move-soft:#FFE5DB; --move-mid:#FF6A3D;
  --idea:#8A3DB3; --idea-soft:#F6E7FE; --idea-mid:#B65CE8;
  --ai:#08788F; --ai-soft:#DDF6FB; --ai-mid:#10B4D0;
  --display:'Mitr','Prompt','Noto Sans Thai',system-ui,sans-serif;
  --body:'Prompt','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --lift:none; --bg:#1A1512; --surface:#251F1B; --tile:#312924; --ink:#F6EFE7; --muted:#B9AA9C; --line:#3A312B;
  --accent:#F2A516; --accent-soft:#3A2C12; --accent-line:#A9740C; --warn-bg:#3A2C12; --on-accent:#2B211C; --danger:#FF7A6B;
  --flight:#A8C6F0; --flight-soft:#1B2A40; --flight-mid:#4A86D6;
  --stay:#FFD27A; --stay-soft:#3A2C12; --stay-mid:#F2A516;
  --place:#B5D98C; --place-soft:#22301A; --place-mid:#6FAE38;
  --move:#FFAE96; --move-soft:#3D1F18; --move-mid:#E8664A; --idea:#E4B8F2; --idea-soft:#2F1E35; --idea-mid:#B46DD0; --ai:#9EE0EC; --ai-soft:#15303A; --ai-mid:#22A7BF; color-scheme:dark}}
:root[data-theme="dark"]{
  --lift:none; --bg:#1A1512; --surface:#251F1B; --tile:#312924; --ink:#F6EFE7; --muted:#B9AA9C; --line:#3A312B;
  --accent:#F2A516; --accent-soft:#3A2C12; --accent-line:#A9740C; --warn-bg:#3A2C12; --on-accent:#2B211C; --danger:#FF7A6B;
  --flight:#A8C6F0; --flight-soft:#1B2A40; --flight-mid:#4A86D6;
  --stay:#FFD27A; --stay-soft:#3A2C12; --stay-mid:#F2A516;
  --place:#B5D98C; --place-soft:#22301A; --place-mid:#6FAE38;
  --move:#FFAE96; --move-soft:#3D1F18; --move-mid:#E8664A; --idea:#E4B8F2; --idea-soft:#2F1E35; --idea-mid:#B46DD0; --ai:#9EE0EC; --ai-soft:#15303A; --ai-mid:#22A7BF; color-scheme:dark}
html,body{min-height:100%}
/* white cards on a near-white page: a hairline shadow keeps them apart */
.card,.cat-card,.day-list,.list-row,.hero,.stepper-card,.cal .tab:not(.out):not(.past),.screen>.top .round,.home-top .me-btn{box-shadow:var(--lift)}
.screen .fld input,.screen .fld select,.join-row input{box-shadow:inset 0 0 0 1px var(--line)}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Match the installed app canvas without changing content position or viewport. */
@media (display-mode:standalone){:root{background:var(--bg)}}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.screen{max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top h1{font-size:22px;flex:1;min-width:0}
.round{width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.pill-btn{height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.btn{height:54px;border-radius:999px;border:0;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:500;font-size:17px;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.link-btn{border:0;background:none;text-decoration:underline;font-weight:500;font-size:14px;min-height:44px;padding:0 8px;align-self:center}
.card{background:var(--surface);border-radius:24px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:18px;font-weight:500}
.create{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 20px 20px 22px;border-radius:28px;border:0;background:var(--accent);color:var(--on-accent);text-align:left;width:100%}
.create b{display:block;font-family:var(--display);font-weight:600;font-size:21px}
.create .dot{width:52px;height:52px;border-radius:999px;background:var(--on-accent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.hero{display:block;width:100%;padding:0;border:0;text-align:left;background:var(--surface);border-radius:28px;overflow:hidden}
.hero .cover{position:relative;height:130px;background:var(--accent-soft)}
.hero .cover svg{position:absolute;inset:0;width:100%;height:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.hero .chip{position:absolute;left:14px;top:14px}
.hero .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.hero .name{font-family:var(--display);font-weight:600;font-size:20px}
.list-row{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:var(--surface);border:0;width:100%;text-align:left}
.thumb{width:48px;height:48px;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none}
.grow{flex:1;min-width:0}
.t-name{font-family:var(--display);font-weight:500;font-size:16px;overflow-wrap:anywhere}
.avatars{display:flex}
.av{width:30px;height:30px;border-radius:999px;background:var(--tile);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.av+.av{margin-left:-8px}
.av.me{background:var(--accent);color:var(--on-accent)}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;min-width:0;height:50px;border-radius:16px;border:0;background:var(--surface);padding:0 16px;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.join-row input::placeholder{letter-spacing:0;text-transform:none;color:var(--muted)}
.join-row button{height:50px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);padding:0 18px;font-weight:500;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px}
.empty svg.art{width:150px;height:90px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0}
.fld input,.fld select{height:52px;border-radius:16px;border:0;background:var(--surface);padding:0 16px;font-size:16px;font-weight:400;width:100%;min-width:0}
.card .fld input,.card .fld select,.sheet .fld input,.sheet .fld select{background:var(--tile)}
.fld.sm{font-size:12px;font-weight:400;color:var(--muted)}
.fld.sm input,.fld.sm select{height:46px;border-radius:14px;padding:0 12px;font-size:15px;color:var(--ink)}
.fld.warn input{background:var(--warn-bg);box-shadow:inset 0 0 0 2px var(--accent-line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .full{grid-column:1/-1}
.grid2>*{min-width:0}
/* iOS gives date and time inputs a fixed natural width that ignores width:100%; drop the native box so they fit their column */
.fld input[type=date],.fld input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;line-height:normal;text-align:left;padding:0 12px}
.fld input[type=date]::-webkit-date-and-time-value,.fld input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.3em}
.fld input::-webkit-datetime-edit{padding:0}
/* iOS pins the value of an appearance:none date/time box to the top; size it by padding around one fixed line so it sits centred like the other fields */
.fld input[type=date],.fld input[type=time]{box-sizing:border-box;line-height:22px;padding-top:12px;padding-bottom:12px;overflow:hidden}
.fld.sm input[type=date],.fld.sm input[type=time]{padding-top:10px;padding-bottom:10px}
.fld input[type=date]::-webkit-date-and-time-value,.fld input[type=time]::-webkit-date-and-time-value{line-height:22px;min-height:22px}
.stepper-card{background:var(--surface);border-radius:24px;padding:4px 16px}
.step-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.step-row+.step-row{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:999px;border:0;background:var(--tile);display:flex;align-items:center;justify-content:center}
.stepper output{width:28px;text-align:center;font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.trip-head{background:var(--accent-soft);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.trip-head .row{display:flex;justify-content:space-between;align-items:center;position:relative}
.trip-head h1{font-size:26px;position:relative}
.trip-head .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.trip-head svg.art{position:absolute;right:0;bottom:0;width:180px;height:110px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;border:0;background:var(--surface);text-align:left}
.tile .thumb{width:44px;height:44px;border-radius:14px}
.tile b{font-family:var(--display);font-weight:500;font-size:17px;display:block}
.tabs-wrap{overflow-x:auto;margin-inline:-4px;padding:2px 4px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:8px}
.tab{height:58px;border-radius:18px;border:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tab span{font-size:12px}
.tab b{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.day-list{position:relative;background:var(--surface);border-radius:24px;padding:4px 16px;margin:0;list-style:none}
.day-list li+li{border-top:1px solid var(--line)}
.entry{display:flex;align-items:center;gap:12px;min-height:72px;width:100%;border:0;background:none;text-align:left;padding:8px 0}
.entry .time{width:48px;flex:none;font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.entry .thumb{width:40px;height:40px;border-radius:12px}
.entry .ttl{font-weight:500;overflow-wrap:anywhere}
.add-dash{height:54px;border-radius:20px;border:2px dashed var(--line);background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;width:100%}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-row .add-dash{border-color:color-mix(in srgb,var(--mid) 45%,transparent);color:var(--deep);font-size:14px;gap:6px;padding:0 8px;white-space:nowrap}
.add-row>[data-act="day-ideas-open"]{grid-column:1/-1}
.add-row .add-dash .ic{color:var(--mid)}
.drop{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px 26px;border-radius:28px;border:2px dashed var(--accent-line);background:var(--accent-soft);text-align:center;cursor:pointer}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#paste-text{border:0;border-radius:16px;background:var(--surface);padding:12px 14px;font:inherit;font-size:15px;font-weight:400;resize:vertical;min-height:130px;width:100%}
.f-card .hd b{display:flex;align-items:center;gap:8px}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.home-top h1{font-size:24px}
.me-btn{width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);font-weight:600;padding:0;overflow:hidden;flex:none;display:inline-flex;align-items:center;justify-content:center}
.me-btn img{width:100%;height:100%;object-fit:cover;display:block}
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.login img.logo{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px rgba(29,27,46,.15)}
.login h1{font-size:28px;margin:0}
#gbtn{min-height:44px;display:flex;justify-content:center}
.new-btn{height:44px;padding:0 16px 0 12px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:15px;flex:none}
.eyebrow{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tlist{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:20px;overflow:hidden}
.trow{position:relative;overflow:hidden}
.tlist .trow+.trow .trow-slide{border-top:1px solid var(--line)}
.trow.big{border-radius:28px}
.trow.small{border-radius:22px}
.trow.big .trow-actions,.trow.small .trow-actions{width:96px}
.trow.big.open .trow-slide,.trow.small.open .trow-slide{transform:translateX(-88px)}
.trow-actions{position:absolute;top:0;right:0;bottom:0;width:88px;display:flex}
/* plan-row actions: two small soft round buttons, not full-height colour blocks */
.erow{--w:108px}
.erow .trow-actions{width:var(--w);align-items:center;justify-content:flex-end;gap:8px;padding-right:12px;background:var(--surface)}
.trow.big.erow .trow-actions,.trow.small.erow .trow-actions{background:transparent;padding-right:4px}
.sw-btn{width:40px;height:40px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sw-edit{background:var(--tile);color:var(--ink)}
.sw-del{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.sw-yes{width:auto;padding:0 16px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);font-size:14px;font-weight:600}
.trow.erow.open .trow-slide{transform:translateX(calc(-1 * var(--w)))}
.day-list{overflow:hidden}
.day-list .erow,.cat-list .erow{list-style:none}
.dock-body .erow .trow-slide{background:var(--surface)}
.day-list.day-list{padding:2px 0}
.day-list li+li{border-top:0}
.day-list li+li::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line);z-index:1;pointer-events:none}
.reorderable-entry{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:grab}.day-list .place-placeholder{border-radius:0;background:transparent!important;outline:0;border:0;box-shadow:none}.day-list .place-placeholder::before{display:none}.place-placeholder>*{visibility:hidden}.place-floating{position:fixed;left:0;top:0;z-index:10000;pointer-events:none;background:var(--surface);border-radius:18px;box-shadow:0 14px 36px rgba(43,33,28,.24),0 2px 8px rgba(43,33,28,.14);outline:1px solid var(--line);overflow:hidden;will-change:transform;animation:placeLift .12s ease-out}.place-floating .entry{padding:14px 16px;width:100%;cursor:grabbing}.place-floating .sw-btn{display:none}@keyframes placeLift{from{opacity:.7;box-shadow:0 2px 6px rgba(43,33,28,.1)}to{opacity:1}}

.day-list .entry{padding-left:16px;padding-right:16px}
.cat-list.cat-list{padding:0}
.cat-list .cat-row{padding-left:4px;padding-right:4px}
.swipe-del{flex:1;border:0;background:var(--danger);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600}
.trow-slide{position:relative;background:var(--surface);transition:transform .22s ease;touch-action:pan-y;will-change:transform}
.trow.dragging .trow-slide{transition:none}
.trow.open .trow-slide,.trow:has(.swipe-del:focus-visible) .trow-slide{transform:translateX(-88px)}
@media (prefers-reduced-motion: reduce){.trow-slide{transition:none}}
.trow-main{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;text-align:left;min-height:64px;color:var(--muted)}
.trow-main .grow{color:var(--ink)}
.trow-main .t-name{font-size:15px}
.badge{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;flex:none}
.badge b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;display:flex}
.badge span{font-size:10px}
.badge.past{background:var(--tile)}
.badge.now{background:var(--accent)}
.badge.now span,.badge.now b{color:var(--on-accent)}
.more{width:44px;height:44px;border-radius:999px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.menu{display:flex;flex-direction:column;background:var(--tile);border-radius:18px;padding:4px 14px}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;border:0;background:none;text-align:left;font-weight:500}
.menu button+button{border-top:1px solid var(--line)}
.menu .danger{color:var(--danger)}
.cat-card{background:var(--surface);border-radius:24px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
/* trip info lives in a floating bar at the bottom: it slides away while scrolling down, comes back on the way up, and opens upward when a tab is tapped */
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px) + var(--kb,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:16;
  background:var(--surface);border-radius:22px;padding:6px;
  box-shadow:0 6px 24px rgba(43,33,28,.16),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .28s ease,opacity .28s ease,bottom .2s ease-out}
/* while typing, the tab row steps aside so the panel gets the room */
html.kb .dock.open .seg{display:none}
html.kb .dock{bottom:calc(6px + var(--kb,0px))}
.dock.hide{transform:translate(-50%,calc(100% + 24px));opacity:0;pointer-events:none}
.dock .seg{background:transparent;padding:0}
.dock-panel{display:flex;flex-direction:column;gap:6px;padding:6px 6px 4px;max-height:min(62vh,var(--vvh,100vh) - 170px)}
.dock.anim .dock-panel{animation:dockUp .22s ease}
.dock-hd{display:flex;align-items:center;gap:10px;padding:2px 2px 0 4px;color:var(--deep)}
.dock-hd .round.sm{width:34px;height:34px;background:var(--tile);color:var(--muted)}
.dock-body{overflow-y:auto;overscroll-behavior:contain;min-height:0}
/* dims from the bottom and fades to clear before the top: iPhone tints the status bar from the page a beat late, so a dark top made it flash */
.dock-scrim{position:fixed;inset:0;z-index:15;background:linear-gradient(to top,rgba(20,19,26,.34) 0%,rgba(20,19,26,.24) 40%,rgba(20,19,26,.08) 72%,rgba(20,19,26,0) 90%)}
.dock-scrim.anim{animation:fadeIn .22s ease}

  if(!validD(t.startDate)) return "ยังไม่มีวันที่";

async function flushRun(){

const pendingIds = () => new Set(C.outbox.flatMap(o => o.action === "saveItems" ? (o.body.items||[]).map(i => i.id) : o.action === "deleteItem" ? [o.body.id] : []));

async function refreshTrips(){

    const list = await api("myTrips");
    const waiting = new Set(C.outbox.filter(o => o.action === "saveTrip").map(o => o.body.trip.id));
    const gone = new Set(C.outbox.filter(o => o.action === "deleteTrip" || o.action === "leaveTrip").map(o => o.body.id));
    list.forEach(t => { if(!waiting.has(t.id)) C.trips[t.id] = t; else if(C.trips[t.id]) Object.assign(C.trips[t.id], {memberIds:t.memberIds, members:t.members, ownerId:t.ownerId}); });

  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);

function orderedDayPlaces(date){
  const base=S.items.filter(i=>i.type==='place'&&i.date===date).sort((a,b)=>String(a.time||'99').localeCompare(String(b.time||'99'))||Number(a.createdAt||0)-Number(b.createdAt||0)||a.id.localeCompare(b.id));
  const index=new Map(base.map((i,n)=>[i.id,n]));
  const saved=S.trip?.dayRowOrder?.[date];if(Array.isArray(saved)){const rank=i=>{const at=saved.indexOf(JSON.stringify([i.id,'']));return at<0?saved.length+index.get(i.id):at;};return base.sort((a,b)=>rank(a)-rank(b));}
  return base.sort((a,b)=>(Number.isFinite(a.data?.dayOrder)?a.data.dayOrder:index.get(a.id))-(Number.isFinite(b.data?.dayOrder)?b.data.dayOrder:index.get(b.id)));
}
function dayOrderPending(date){return S.items.some(i=>i.type==='place'&&i.date===date&&i.data?.orderPending);}
function saveDayOrder(date,ids,tripId){
  if(S.trip?.id!==tripId||S.directSaving||S.ai?.step==='loading')return false;
  const places=orderedDayPlaces(date),known=new Set(places.map(i=>i.id));
  if(ids.length!==places.length||new Set(ids).size!==ids.length||ids.some(id=>!known.has(id))){toast('รายการเปลี่ยนไปแล้ว ลองเรียงใหม่อีกครั้ง');render();return false;}
  if(ids.every((id,n)=>id===places[n].id)){render();return true;}
  const patches=ids.map((id,dayOrder)=>({id,data:{...places.find(i=>i.id===id).data,dayOrder,orderPending:true}}));
  for(const patch of patches)C.items[tripId][patch.id]={...C.items[tripId][patch.id],data:patch.data};
  queue('saveItems',{tripId,items:patches});S.ai=null;emit();toast('เรียงสถานที่แล้ว');return true;
}
function dayEntryKey(e){return JSON.stringify([e.it.id,e.phase||'']);}
function saveDayRowOrder(date,keys,tripId){
  if(S.trip?.id!==tripId||S.directSaving||S.ai?.step==='loading')return false;
  const rows=dayEntries(date).filter(e=>!e.night),current=rows.map(dayEntryKey),known=new Set(current);
  if(keys.length!==current.length||new Set(keys).size!==keys.length||keys.some(k=>!known.has(k))){toast('รายการเปลี่ยนไปแล้ว ลองเรียงใหม่อีกครั้ง');render();return false;}
  if(keys.every((k,n)=>k===current[n])){render();return true;}
  const patch={dayRowOrder:{[date]:keys.slice()}};
  C.trips[tripId]=deepMerge(C.trips[tripId],patch);
  queue('saveTrip',{trip:{id:tripId,...patch}});S.ai=null;emit();toast('เรียงรายการแล้ว');return true;
}
function dayEntries(dateStr){
  const out = [];
  for(const it of S.items){
    if(it.type === "stay"){
      const sd = it.data || {};
      if(it.date === dateStr) out.push({it, phase:"in", time:it.time, title:"เช็กอิน " + (it.title||"ที่พัก"), sub:s_(sd.inNote)});
      if(it.endDate === dateStr) out.push({it, phase:"out", time:it.endTime, title:"เช็กเอาต์ " + (it.title||"ที่พัก"), sub:s_(sd.outNote)});
    } else {
      const d = it.data || {}, ad = it.type === "flight" ? arrDateOf(it) : "", split = ad && ad !== it.date;
      /* a flight's own notes: before departure on its row, after landing on the arrival row (or the same row when it lands that day) */
      const fNote = it.type === "flight" ? [s_(d.note), split ? "" : s_(d.arrNote)].filter(Boolean).join(" · ") : "";
      if(it.date === dateStr) out.push({it, phase:"", time:it.time, title:it.title, sub:subOf(it), note:fNote});
      if(it.type === "flight" && split && ad === dateStr)
        out.push({it, phase:"arr", time:d.arrTime, title:`ถึง ${d.toCity || d.to || "ปลายทาง"}`, sub:[s_(d.flightNo), `ออก ${it.time||"-"} (${dShort(it.date)})`].filter(Boolean).join(" · "), note:s_(d.arrNote)});
    }
  }
  out.sort((a,b) => (a.time||"99") < (b.time||"99") ? -1 : 1);
  const places=orderedDayPlaces(dateStr);let placeAt=0;out.forEach((e,n)=>{if(e.it.type==='place'){const it=places[placeAt++];out[n]={...e,it,time:it.time,title:it.title,sub:subOf(it),orderPending:dayOrderPending(dateStr)};}});
  const saved=S.trip?.dayRowOrder?.[dateStr];
  if(Array.isArray(saved)){
    const ranks=new Map(saved.map((key,n)=>[key,n])),base=new Map(out.map((e,n)=>[dayEntryKey(e),n]));
    out.sort((a,b)=>(ranks.has(dayEntryKey(a))?ranks.get(dayEntryKey(a)):saved.length+base.get(dayEntryKey(a)))-(ranks.has(dayEntryKey(b))?ranks.get(dayEntryKey(b)):saved.length+base.get(dayEntryKey(b))));
  }
  /* where everyone sleeps tonight: any stay whose nights cover this date */
  for(const it of S.items){
    if(it.type === "stay" && validD(it.date) && validD(it.endDate) && it.date <= dateStr && dateStr < it.endDate)
      out.push({it, phase:"night", night:true, time:"", title:"นอนที่ " + (it.title||"ที่พัก"), sub:""});
    if(it.type === "flight" && validD(it.date)){
      const ad = arrDateOf(it);
      if(validD(ad) && it.date <= dateStr && dateStr < ad)
        out.push({it, phase:"night", night:true, time:"", title:"นอนบนเครื่องบิน", sub:s_((it.data||{}).flightNo)});
    }
  }
  return out.map(e=>({...e,dayDate:dateStr}));
}
/* flights show number and arrival only; the airline name is in the detail sheet */
function arrDateOf(it){
  const d = it.data || {};
  if(validD(d.arrDate)) return d.arrDate;
  if(!validD(it.date)) return "";
  return (d.arrTime && it.time && d.arrTime < it.time) ? addDays(it.date, 1) : it.date;
}
function subOf(it){
  if(it.type !== "flight") return it.sub || "";
  const d = it.data || {};
  const ad = arrDateOf(it), shift = validD(ad) && validD(it.date) ? daysBetween(it.date, ad) : 0;
  const arr = d.arrTime ? `ถึง ${d.arrTime}${shift > 0 ? ` (${dShort(ad)})` : ""}` : "";
  return [s_(d.flightNo), arr].filter(Boolean).join(" · ");
}

function mapNameParts(value){
 const full=String(value||'').trim().replace(/\s+/g,' '),comma=full.search(/[,，]/);
 if(comma<1)return {name:full,address:''};
 const first=full.slice(0,comma).trim(),tail=full.slice(comma+1).trim();
 const address=/〒|\b\d{3}-\d{4}\b|\b\d{5}(?:-\d{4})?\b|\d+[-–]\d+|\d+\s*(?:chome|丁目|番地|หมู่|ซอย|ถนน)|^\d+\s/i.test(tail);
 if(address&&!/^(Japan|Thailand|日本|ประเทศไทย)$/i.test(first))return {name:first,address:tail};
 return {name:full,address:''};
}

/* trip days laid out as a Sunday-first calendar, 7 per row */
function calendar(dates){
  const first = dates[0], last = dates[dates.length-1];
  const lead = parseD(first).getDay();
  const before = Array.from({length:lead}, (_,k) => addDays(first, k - lead));
  const trail = (7 - (lead + dates.length) % 7) % 7;
  const after = Array.from({length:trail}, (_,k) => addDays(last, k + 1));
  const out = x => `<span class="tab out" aria-hidden="true"><b>${parseD(x).getDate()}</b></span>`;
  return `<div class="cal">
    <div class="cal-head" aria-hidden="true">${DOW.map(d => `<span>${d}</span>`).join("")}</div>

function aiChanges(s,d){

/* trip days as a small calendar; tap days to include or leave out */
function aiCal(dates, picked, act = "ai-day", only = null){
  const first = dates[0], last = dates[dates.length-1], lead = parseD(first).getDay();
  const trail = (7 - (lead + dates.length) % 7) % 7;
  const blank = n => Array.from({length:n}, () => `<span class="aic out"></span>`).join("");
  return `<div class="ai-cal"><div class="ai-dow" aria-hidden="true">${DOW.map(d => `<span>${d}</span>`).join("")}</div><div class="ai-days">${blank(lead)}${dates.map((x, i) => {
    const d = parseD(x), on = picked.includes(x), off = only && !only.includes(x);
    return `<button type="button" class="aic" aria-pressed="${on}" aria-label="วันที่ ${i+1} ${esc(dLong(x))}" data-act="${act}" data-d="${x}" ${off ? "disabled" : ""}><b>${d.getDate()}</b>${d.getDate() === 1 || i === 0 ? `<i>${MON[d.getMonth()]}</i>` : ""}</button>`;
  }).join("")}${blank(trail)}</div></div>`;
}
/* planning can take a minute; if the phone drops the request meanwhile (screen locked, app in the background), pick the answer up from the server */
async function planCall(s, action, body){
  const job = rid();
  try { return await api(action, {...body, job}, s.ctl.signal); }
  catch(e){
    if(!e || (e.code !== "offline" && e.code !== "server_error")) throw e;
    for(let i = 0; i < 45; i++){
      await new Promise(ok => setTimeout(ok, 4000));
      if(s.ctl.signal.aborted || S.ai !== s) throw {code:"cancelled"};
      let r = null; try { r = await api("planResult", {job}); } catch(_){ continue; }
      if(r && r.missing && i > 3) break;
      if(r && r.done){ if(r.error) throw {code:r.error}; return r.plan; }
    }
    throw e;
  }
}

/* step 1: AI drafts which places go on which day */
async function aiRun(){
  const s=S.ai,t=S.trip;if(!s||!t||s.step==='loading')return;
  const dates=tripDates(t).filter(d=>s.dates.includes(d));if(!dates.length){s.err='เลือกวันที่ต้องการจัดแผนก่อน';render();return;}
  if(s.adults+s.elders<1){s.err='ต้องมีผู้ใหญ่หรือผู้สูงอายุอย่างน้อย 1 คน';render();return;}
  if(s.analyse&&!S.items.some(i=>i.type==='place'&&dates.includes(i.date))){s.err='เพิ่มสถานที่ในวันนี้ก่อนวิเคราะห์';render();return;}
  aiRemember(s);s.baseDays=dates.map(date=>({date,items:S.items.filter(i=>['place','move'].includes(i.type)&&i.date===date).map(i=>({...i,ref:i.id,ideaId:(i.data||{}).fromIdea,until:(i.data||{}).until||''}))}));
  s.compareDays=null;s.err='';s.result=null;s.assign=null;s.ctl=new AbortController();
  const pool=aiPool(dates);
  if(s.intent==='improve'){
    s.assign={days:dates.map(date=>({date,ids:orderedDayPlaces(date).map(i=>i.id)})),left:[]};s.viewDay=dates[0];if(s.analyse){await aiRoute(s_(s.note)||undefined,true);return;}s.step='pick';render();return;
  }
  if(!pool.length){s.assign={days:dates.map(date=>({date,ids:[]})),left:[]};s.viewDay=dates[0];s.step='pick';render();return;}
  s.step='loading';s.loadMsg='กำลังเลือกสถานที่ให้เหมาะกับวัน…';render();
  try{
    const res=await planCall(s,'planAssign',{tripId:t.id,dates,prefs:aiPrefs(s)});if(S.ai!==s)return;
    s.assign=res;s.viewDay=(res.days.find(d=>d.ids.length)||res.days[0]||{}).date;s.step='pick';render();
  }catch(e){if(S.ai!==s)return;s.step='ask';s.err=e&&e.code==='cancelled'?'':aiErr(e);render();}
}
const aiPrefs=s=>({adults:s.adults,children:s.children,elders:s.elders,start:pad(Math.floor(s.start/60))+':'+pad(s.start%60),interests:s.interests,useIdeas:s.useIdeas,meals:s.meals,note:s_(s.note),requiredIds:(s.requiredIds||[]).filter(id=>aiPriorityPool(s).some(i=>i.id===id))});

async function aiRoute(wish,dayOnly=false){
  const s = S.ai, t = S.trip; if(!s || !t || !s.assign || s.step==='loading') return;
  const prev = s.result, one = dayOnly ? s.viewDay : wish && prev ? (prev.days.some(d => d.date === s.viewDay) ? s.viewDay : (prev.days[0] || {}).date) : "";
  const days = s.assign.days.filter(d => !one || d.date === one).map(d => ({date:d.date, ids:d.ids}));
  s.err="";s.step = "loading"; s.loadMsg = s.analyse?"กำลังวิเคราะห์ลำดับ เวลา และการเดินทางของวันนี้…":one ? "กำลังปรับตามที่ขอ…" : "กำลังจัดเวลาและการเดินทาง…"; s.ctl = new AbortController(); render();
  try{
    if(s.analyse){await flush();if(C.outbox.length)throw {code:'pending_sync'};if(S.ai!==s)return false;if(s.ctl.signal.aborted)throw {code:'cancelled'};}
    const ids=days.flatMap(d=>d.ids);if(new Set(ids).size!==ids.length)throw {code:'duplicate_plan_place'};
    const res={days:[],revision:null};
    for(let at=0;at<days.length;at+=2){
      const batch=days.slice(at,at+2);
      if(days.length>2){s.loadMsg='กำลังจัดเวลา '+(at+1)+'–'+Math.min(at+2,days.length)+' จาก '+days.length+' วัน…';render();}
      const part=await planCall(s,'planRoute',{tripId:t.id,days:batch,prefs:aiPrefs(s),analyse:!!s.analyse,...((wish||one)?{wish:s_(wish),draft:one&&prev?prev.days.filter(d=>d.date===one):[]}:{} )});
      if(S.ai!==s)return;
      if(s.ctl.signal.aborted)throw {code:'cancelled'};
      if(res.revision&&part.revision&&res.revision!==part.revision)throw {code:'plan_changed'};
      if(!Array.isArray(part.days)||part.days.length!==batch.length||part.days.some(d=>!batch.some(b=>b.date===d.date))||new Set(part.days.map(d=>d.date)).size!==batch.length)throw {code:'plan_place_missing'};

    }
    const fresh = res.days;
    if(prev&&s.baseRevision&&res.revision&&s.baseRevision!==res.revision)throw {code:"plan_changed"};
    if(days.some(d => !fresh.some(x => x.date === d.date))) throw {code:"plan_place_missing"};
    for(const d of days){
      const got = fresh.find(x => x.date === d.date);
      const refs = got.items.filter(x => x.type === "place").map(x => x.ref);
      if(refs.length !== d.ids.length || (s.analyse?new Set(refs).size!==refs.length||refs.some(id=>!d.ids.includes(id)):refs.some((id,i)=>id!==d.ids[i]))) throw {code:"plan_place_missing"};
    }
    if(s.analyse)for(const d of fresh){const a=s.assign.days.find(x=>x.date===d.date);if(a)a.ids=d.items.filter(x=>x.type==='place').map(x=>x.ref);}
    s.baseRevision=res.revision;s.saveOperation=null;s.compareDays=prev?JSON.parse(JSON.stringify(prev.days)):null;
    s.result = one && prev ? {days:[...prev.days.filter(d=>!fresh.some(x=>x.date===d.date)),...fresh].sort((a,b)=>a.date.localeCompare(b.date))} : {days:fresh};
    s.picks = {}; s.result.days.forEach((d, di) => d.items.forEach((x, xi) => s.picks[di + "." + xi] = true));
    if(!one) s.viewDay = (fresh.find(d => d.date === s.viewDay) || fresh[0] || {}).date;
    s.wish = ""; s.showRefine=false; s.step = "review"; render();return true;
  } catch(e){
    if(S.ai !== s) return;
    s.step = prev && one ? "review" : s.analyse?"ask":"pick";s.err=e&&e.code==='cancelled'?'':e.code==='plan_changed'?featureError(e):aiErr(e); render();
    if(!(e && e.code === "cancelled")) toast(e.code==='plan_changed'?featureError(e):aiErr(e));return false;
  }
}
function aiInvalidateDraft(dates){

  s.picks={};s.result?.days.forEach((d,di)=>d.items.forEach((x,xi)=>s.picks[di+'.'+xi]=true));
  s.saveOperation=null;
}
function aiMoveStop(id, dir){

        docs.push(x.type==='move'?{...base,type:'move',title:moveTitle(x.from,x.to),data:{mode:x.mode,from:x.from,to:x.to,options:x.options||[],durationMinutes:travelMinutes(x)}}:

      }

    for(const [id,data] of Object.entries(noteBy))notes.push({id,data});
    s.saveOperation ||= rid();
    const res=await api('replacePlan',{tripId:t.id,revision:s.baseRevision||C.revisions[t.id],dates,items:docs,notes,operation:s.saveOperation});

  }catch(e){toast(featureError(e));if(e.code==='plan_changed')refreshTrip(t.id);}
  finally{s.saving=false;S.directSaving=false;render();}
}

/* Travel time changes keep reservations fixed and absorb spare time before them. */
function travelMinutes(x){
  if(Number.isFinite(+x.durationMinutes) && +x.durationMinutes>0)return +x.durationMinutes;
  const note=String(x.note||x.sub||'');
  const h=note.match(/(\d+(?:\.\d+)?)\s*(?:ชั่วโมง|ชม\.?|hours?|hrs?)/i),m=note.match(/(\d+)\s*(?:นาที|mins?|minutes?)/i);
  return h||m ? Math.round((h?+h[1]*60:0)+(m?+m[1]:0)) : 30;
}
function minute(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60 + +m[2]:-1;}
function clockTime(n){return pad(Math.floor(n/60))+':'+pad(n%60);}
function changeTravel(day,index,option){
  const items=JSON.parse(JSON.stringify(day.items)),old=items[index];
  if(!old||old.type!=='move')return {error:'ไม่พบช่วงเดินทาง'};
  const before=travelMinutes(old),after=travelMinutes(option);
  if(minute(old.time)<0||minute(old.time)+after>1439)return {error:"ตารางเกินหนึ่งวัน กรุณาลดสถานที่หรือเปลี่ยนวิธีเดินทาง"};
  old.mode=option.mode;old.note=option.note;old.durationMinutes=after;
  let shift=after-before,ready=minute(old.time)+after;
  for(let i=index+1;i<items.length;i++){
    const x=items[i],was=minute(x.time),end=minute(x.until),duration=x.type==='move'?travelMinutes(x):Math.max(1,end>was?end-was:60);
    let at=was+shift;
    if(x.inside){at=Math.max(0,at);}else at=Math.max(ready,at);
    if(x.lockedTime){
      const lock=minute(x.lockedTime);
      if(lock<0||ready>lock)return {error:'ไปไม่ทัน '+x.title+' ที่ล็อกไว้ '+x.lockedTime+' ลองเลือกการเดินทางที่เร็วขึ้นหรือลดจุดก่อนหน้า'};
      at=lock;shift=0;
    }else shift=at-was;
    if(at<0||at+duration>1439)return {error:'ตารางเกินหนึ่งวัน กรุณาลดสถานที่หรือเปลี่ยนวิธีเดินทาง'};
    x.time=clockTime(at);if(x.type==='place')x.until=clockTime(at+duration);
    ready=Math.max(ready,at+duration);
  }
  if(day.deadline!=null&&day.deadline>=0&&ready>day.deadline)return {error:'ไปสนามบินไม่ทันเวลาเผื่อ 3 ชั่วโมง ลองเลือกการเดินทางที่เร็วขึ้น'};
  let previous=-1;
  for(const x of items){
    const at=minute(x.time);
    if(x.lockedTime && at!==minute(x.lockedTime))return {error:'เวลาจองถูกเปลี่ยน กรุณาจัดแผนใหม่'};
    if(!x.inside && at<previous)return {error:'ตารางยังทับกันก่อนช่วงที่เลือก กรุณาปรับช่วงเดินทางก่อนหน้า'};
    if(!x.inside)previous=at+(x.type==='move'?travelMinutes(x):Math.max(1,minute(x.until)-at));
  }
  return {items,conflicts:[]};
}

function applyPlanResponse(id,res){C.items[id]=Object.fromEntries(res.items.map(i=>[i.id,i]));(C.revisions ||= {})[id]=res.revision;emit();}
function dayRouteLinks(date){
  const entries=dayEntries(date).filter(e=>!e.night),moves=entries.filter(e=>e.it.type==='move'&&routeLink(e.it)).map(e=>e.it);
  if(moves.length)return moves.map(it=>({title:moveTitle(it.data.from,it.data.to),mode:it.data.mode||'',href:routeLink(it),time:it.time||''}));
  const places=entries.filter(e=>e.it.type==='place').map(e=>e.it);
  if(!places.length)return [];
  const prev=addDays(date,-1),hasFlight=entries.some(e=>e.it.type==='flight');
  const start=!hasFlight&&S.items.find(i=>i.type==='stay'&&i.date<=prev&&prev<i.endDate);
  const end=!hasFlight&&S.items.find(i=>i.type==='stay'&&i.date<=date&&date<i.endDate);
  const stops=[start,...places,end].filter(Boolean),links=[];
  for(let i=1;i<stops.length;i++)if(stops[i-1].id!==stops[i].id){
    const from=stops[i-1].title,to=stops[i].title;
    links.push({title:moveTitle(from,to),mode:'เลือกวิธีเดินทางใน Google Maps',href:routeLink({type:'move',data:{from,to}}),time:''});
  }
  return links;
}
function dayRoutePoints(date){
  const entries=dayEntries(date).filter(e=>!e.night),places=entries.filter(e=>e.it.type==='place').map(e=>e.it);
  if(!places.length)return [];
  const flights=S.items.filter(i=>i.type==='flight'&&i.data),prev=addDays(date,-1);
  const stay=x=>S.items.find(i=>i.type==='stay'&&i.date<=x&&x<i.endDate);
  const arr=flights.find(i=>arrDateOf(i)===date&&(i.date<date||stay(date))),dep=flights.find(i=>i.date===date&&i!==arr);
  const moves=entries.filter(e=>e.it.type==='move').map(e=>e.it),point=it=>({name:it.title,record:it});
  const start=arr?{name:arr.data.to+' airport'}:stay(prev)?point(stay(prev)):moves[0]?.data.from?{name:moves[0].data.from}:null;
  const end=dep?{name:dep.data.from+' airport'}:stay(date)?point(stay(date)):moves.at(-1)?.data.to?{name:moves.at(-1).data.to}:null;
  const out=[];for(const p of [start,...places.map(point),end].filter(Boolean)){const last=out.at(-1);if(!last||last.name!==p.name)out.push(p);}return out;
}
function fullRouteUrl(points,mode){
  if(points.length<2||!['driving','walking'].includes(mode))return '';
  const ends=points.map(p=>mapEndpoint(p.name,p.record)),first=ends[0],last=ends.at(-1),mid=ends.slice(1,-1);
  const q=new URLSearchParams({api:'1',origin:first.query,destination:last.query,travelmode:mode});
  if(first.placeId)q.set('origin_place_id',first.placeId);if(last.placeId)q.set('destination_place_id',last.placeId);
  if(mid.length){q.set('waypoints',mid.map(p=>p.query).join('|'));if(mid.every(p=>p.placeId))q.set('waypoint_place_ids',mid.map(p=>p.placeId).join('|'));}
  return 'https://www.google.com/maps/dir/?'+q.toString();
}
function fullDayRoutes(date,mode='driving'){
  const points=dayRoutePoints(date),out=[];let at=0;
  while(at<points.length-1){let end=Math.min(at+4,points.length-1),href='';while(end>at){href=fullRouteUrl(points.slice(at,end+1),mode);if(href&&href.length<=2048)break;end--;}
    if(end===at)return [];out.push({href,points:points.slice(at,end+1)});at=end;
  }return out;
}

/* what one day looks like on paper: same rows as the plan, with map positions where we have them */
function exportEntries(d){
  return dayEntries(d).map(e => {
    const it = e.it, data = it.data || {};
    const pos = data.lat != null && data.lon != null && data.lat !== "" ? {lat:+data.lat, lon:+data.lon} : null;
    if(e.night) return {type:"stay", night:true, title:e.title, icon:"moon", tone:"t-stay"};
    if(it.type === "move") return {type:"move", time:e.time, title:"ไป " + (s_(data.to) || it.title), note:it.sub || "", icon:itemIcon(it)};
    if(it.type === "flight"){
      // pin the airport: where you land on the arrival row, otherwise whichever end of the flight is nearer the rest of the day
      const ap = c => s_(c) ? s_(c).toUpperCase() + " airport" : "";
      const ends = e.phase === "arr" ? [ap(data.to)] : [ap(data.from), arrDateOf(it) === d ? ap(data.to) : ""].filter(Boolean);
      return {type:"flight", time:e.time, title:e.title, note:[e.sub, e.note].filter(Boolean).join(" · "), icon:"flight", tone:"t-flight", qs:ends};
    }
    const q = it.type === "stay" ? (s_(data.address) || it.title) : [it.title, s_(data.address) || s_(S.trip.destination)].filter(Boolean).join(", ");
    return {type:it.type, time:e.time, title:e.title, note:it.type === "stay" ? (e.sub || "") : (it.sub || ""), icon:itemIcon(it), tone:toneOf(it), ...(pos || {}), q:pos ? "" : q};
  });
}
async function exportPlaces(days){
  let cache = {}; try { cache = JSON.parse(localStorage.getItem("mytrip-geo") || "{}"); } catch(_){}
  const need = [...new Set(days.flatMap(d => d.entries.flatMap(e => [e.q, ...(e.qs || [])]).filter(q => q && !(q in cache))))].slice(0, 60);
  if(need.length && CONNECTED){ try { const res = await api("geocode", {q:need}); need.forEach((q, i) => cache[q] = res[i] || null); } catch(_){} }
  try { localStorage.setItem("mytrip-geo", JSON.stringify(cache)); } catch(_){}
  for(const d of days){
    d.entries.forEach(e => { if(e.q && cache[e.q]){ e.lat = cache[e.q].lat; e.lon = cache[e.q].lon; } });
    const others = d.entries.filter(e => e.lat != null && e.type !== "flight");
    d.entries.forEach(e => {
      const opts = (e.qs || []).map(q => cache[q]).filter(Boolean); if(!opts.length) return;
      let best = opts[0];
      if(others.length && opts.length > 1){
        const dist = p => Math.min(...others.map(o => Math.hypot(o.lat - p.lat, o.lon - p.lon)));
        best = opts.reduce((a, b) => dist(b) < dist(a) ? b : a);
      }
      e.lat = best.lat; e.lon = best.lon;
    });
    // a guess far from the rest of the day is probably a different place with the same name: leave it off the map
    const pts = d.entries.filter(e => e.lat != null);
    if(pts.length >= 3){
      const mid = k => pts.map(e => e[k]).sort((a, b) => a - b)[Math.floor(pts.length / 2)];
      const la = mid("lat"), lo = mid("lon");
      pts.forEach(e => { if(Math.hypot(e.lat - la, (e.lon - lo) * Math.cos(la * Math.PI / 180)) > 0.8){ delete e.lat; delete e.lon; } });
    }
  }
}

/* ---------- render ---------- */
function render(){
  const views = {login:vLogin, home:vHome, new:vNew, invite:vInvite, trip:vTrip, upload:vUpload, review:vReview, join:vJoin};
  const v = views[S.view];
  const active = document.activeElement && document.activeElement.id;
  /* keep the scroll position of the bottom panel and of sheets when the screen is redrawn */
  const keep = [".dock-body", ".sheet"].map(sel => { const el = document.querySelector(sel); return el ? [sel, el.scrollTop, el.dataset.k || ""] : null; }).filter(Boolean);
  document.getElementById("app").innerHTML = (v ? v() : `<div class="load muted">กำลังโหลด…</div>`)
    + (["trip","home"].includes(S.view) ? vSheet() : "")
    + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  if(active){ const el = document.getElementById(active); if(el && el.focus) el.focus({preventScroll:true}); }
  keep.forEach(([sel, y, k]) => { const el = document.querySelector(sel); if(el && y && (el.dataset.k || "") === k) el.scrollTop = y; });
  document.body.style.overflow = S.sheet ? "hidden" : "";
  document.documentElement.classList.toggle("lock", !!(S.sheet || (S.view === "trip" && S.catTab)));
  if(S.view === "login") mountGoogleButton();
  fitAreas(); updateSync();
}
/* typing boxes that grow line by line so the whole message stays visible */
function fitAreas(el){ (el ? [el] : document.querySelectorAll("textarea.grow-area")).forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }); }

const s_ = v => (v === null || v === undefined) ? "" : String(v).trim();
const cleanDate = v => validD(s_(v)) ? s_(v) : "";
const cleanTime = v => { const m = s_(v).match(/^(\d{1,2})[:.](\d{2})/); return m ? `${pad(Math.min(23,+m[1]))}:${m[2]}` : ""; };
const emptyFlight = () => ({airline:"", flightNo:"", date:"", from:"", fromCity:"", depTime:"", to:"", toCity:"", arrTime:"", arrDate:"", passengers:"", bookingRef:""});
/* same flight = same date + same flight number (or same route and departure time when there is no number) */
const normFno = v => { const x = s_(v).toUpperCase().replace(/[\s-]/g, ""); const m = x.match(/^([A-Z0-9]{2})0*(\d{1,4}[A-Z]?)$/); return m ? m[1] + m[2] : x; };
const flightKey = f => validD(f.date) ? f.date + "|" + (normFno(f.flightNo) || `${s_(f.from).toUpperCase()}-${s_(f.to).toUpperCase()}-${f.depTime || ""}`) : "";
/* one name per line, without fare-type tags such as (ADT) or (CHD) */
function paxList(v){
  const seen = new Map();
  s_(v).split(/[,;\n]+/).map(x => x
      .replace(/\(\s*(ADT|ADULT|CHD|CHLD|CHILD|INF|INFT|INFANT|YTH|YOUTH|SRC|SNR)\s*\)/gi, "")
      .replace(/\s+(ADT|CHD|CHLD|INF|INFT)$/i, "")
      .replace(/\s{2,}/g, " ").trim())
    .filter(Boolean).forEach(x => { const k = x.toLowerCase(); if(!seen.has(k)) seen.set(k, x); });
  return [...seen.values()];
}
function makeFlightDoc(f){
  return {type:"flight", date:f.date, time:f.depTime,
    title:`บิน ${f.fromCity||f.from||"?"} → ${f.toCity||f.to||"?"}`,
    sub:[s_(f.flightNo), f.arrTime ? `ถึง ${f.arrTime}` : ""].filter(Boolean).join(" · "),
    data:{airline:f.airline, flightNo:f.flightNo, from:s_(f.from).toUpperCase(), to:s_(f.to).toUpperCase(), fromCity:f.fromCity, toCity:f.toCity, arrTime:f.arrTime, arrDate:validD(f.arrDate) ? f.arrDate : (f.arrTime && f.depTime && validD(f.date) && f.arrTime < f.depTime ? addDays(f.date, 1) : (validD(f.date) ? f.date : "")), passengers:f.passengers, bookingRef:f.bookingRef}};
}
function mergeText(...vals){
  const seen = new Map();
  vals.flatMap(v => s_(v).split(/[,;\n]+/)).map(x => x.trim()).filter(Boolean).forEach(x => { const k = x.toLowerCase(); if(!seen.has(k)) seen.set(k, x); });
  return [...seen.values()].join(", ");
}
function mergeInto(g, f){
  for(const k of Object.keys(f)){
    if(k === "passengers" || k === "bookingRef") g[k] = mergeText(g[k], f[k]);
    else if(k === "files") g.files = [...new Set([...(g.files||[]), ...(f.files||[])])];
    else if(!g[k] && f[k]) g[k] = f[k];
  }
  return g;
}
function mergeFlights(list){
  const out = [], at = new Map(), map = [];
  list.forEach((f, i) => {
    const k = flightKey(f);
    if(k && at.has(k)){ mergeInto(out[at.get(k)], f); map[i] = at.get(k); }
    else { if(k) at.set(k, out.length); map[i] = out.length; out.push({...f}); }
  });
  return {out, map};
}
const emptyStay = (t) => ({name:"", address:"", checkInDate:t && validD(t.startDate) ? t.startDate : "", checkInTime:"14:00", checkOutDate:t && validD(t.startDate) ? addDays(t.startDate, Math.max(1,(t.days||1)-1)) : "", checkOutTime:"12:00", rooms:"", guests:"", bookingRef:""});
const fileIdx = v => Array.isArray(v) ? [...new Set(v.map(Number).filter(n => Number.isInteger(n) && n >= 0))] : [];
function buildReview(kind, res){
  res = res || {};
  const unc = new Set(Array.isArray(res.uncertain) ? res.uncertain.map(String) : []);
  const rawFlights = (Array.isArray(res.flights) ? res.flights : []).filter(f => f && typeof f === "object").map(f => ({
    airline:s_(f.airline), flightNo:s_(f.flightNo), date:cleanDate(f.date), from:s_(f.from).toUpperCase(), fromCity:s_(f.fromCity),
    depTime:cleanTime(f.depTime), to:s_(f.to).toUpperCase(), toCity:s_(f.toCity), arrTime:cleanTime(f.arrTime), arrDate:cleanDate(f.arrDate),
    passengers:s_(f.passengers), bookingRef:s_(f.bookingRef), files:fileIdx(f.files)}));
  const merged = mergeFlights(rawFlights);
  const flights = merged.out;
  flights.forEach(f => { if(!f.passengers) f.passengers = s_(res.passengers); if(!f.bookingRef) f.bookingRef = s_(res.bookingRef); });
  [...unc].forEach(u => { const m = u.match(/^flights\.(\d+)\.(.+)$/); if(m){ unc.delete(u); const j = merged.map[+m[1]]; if(j !== undefined) unc.add(`flights.${j}.${m[2]}`); } });
  const stays = (Array.isArray(res.stays) ? res.stays : (res.stay ? [res.stay] : [])).filter(st => st && typeof st === "object").map(st => ({
    name:s_(st.name), address:s_(st.address), checkInDate:cleanDate(st.checkInDate), checkInTime:cleanTime(st.checkInTime),
    checkOutDate:cleanDate(st.checkOutDate), checkOutTime:cleanTime(st.checkOutTime), rooms:s_(st.rooms), guests:s_(st.guests), bookingRef:s_(st.bookingRef),
    phone:s_(st.phone), website:cleanUrl(st.website), files:fileIdx(st.files)}));
  flights.forEach((f,i) => ["date","depTime"].forEach(k => { if(!f[k]) unc.add(`flights.${i}.${k}`); }));
  stays.forEach((st,i) => ["checkInDate","checkOutDate"].forEach(k => { if(!st[k]) unc.add(`stays.${i}.${k}`); }));
  // a date far outside the trip is worth a second look
  const t = S.trip;
  if(t && validD(t.startDate)){
    const lo = addDays(t.startDate, -7), hi = addDays(t.startDate, (t.days||1) + 7);
    flights.forEach((f,i) => { if(f.date && (f.date < lo || f.date > hi)) unc.add(`flights.${i}.date`); });
    stays.forEach((st,i) => { if(st.checkInDate && (st.checkInDate < lo || st.checkInDate > hi)) unc.add(`stays.${i}.checkInDate`); });
  }
  return {kind, flights, stays, passengers:s_(res.passengers), bookingRef:s_(res.bookingRef), uncertain:unc};
}
function errCopy(code){
  if(/^missing_/.test(code||"")) return "ยังไม่ได้ใส่ API key ใน Apps Script ลองกรอกเองไปก่อน";
  if(/^ai_error/.test(code||"")) return "ตัวอ่านใบจองตอบกลับผิดพลาด ลองใหม่อีกครั้ง หรือกรอกเอง";
  return ({
    not_connected:"ยังไม่ได้เชื่อม Google Sheet เลยอ่านใบจองไม่ได้ ลองกรอกเองได้เลย",
    pending_sync:"ยังมีข้อมูลรอซิงก์ รอให้บันทึกครบก่อนวิเคราะห์",
  offline:"ไม่มีอินเทอร์เน็ต ลองใหม่อีกครั้ง",
    server_error:"เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง",
    empty:"แนบไฟล์ หรือวางข้อความการจองก่อนนะ",
    too_short:"ข้อความสั้นเกินไป วางรายละเอียดการจองทั้งหมดจากอีเมล",
    too_big:"ไฟล์ PDF ใหญ่เกิน 15 MB ลองแคปหน้าจอแทน",
    nothing:"ไม่เจอข้อมูลเที่ยวบินหรือที่พักในสิ่งที่ส่งมา ลองไฟล์อื่น หรือกรอกเอง",
    unsupported:"รองรับไฟล์ PDF, JPG, JPEG และ PNG",
    rate_limited:"ใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่",
    invalid_json:"อ่านใบจองไม่ออก ลองรูปที่ชัดขึ้น หรือกรอกเอง"
  })[code] || "อ่านใบจองไม่สำเร็จ ลองใหม่อีกครั้ง หรือกรอกเอง";
}

/* ---------- reading everything the person sent ---------- */
const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name || "");
const isImg = f => /^image\/(jpe?g|png|webp|gif|heic|heif)$/i.test(f.type || "") || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name || "");
function setStep(txt){ if(S.upload){ S.upload.step = txt; const el = document.getElementById("read-step"); if(el) el.textContent = txt; else render(); } }
function addFiles(list){
  if(!S.upload) return;
  const files = S.upload.files || (S.upload.files = []);
  let bad = 0;
  for(const f of list){ if(isPdf(f) || isImg(f)){ if(files.length < 6) files.push(f); } else bad++; }
  S.upload.status = bad ? "error" : "idle"; S.upload.err = bad ? errCopy("unsupported") : "";
  render();
}
function autoSaveable(r){
  if(r.uncertain.size) return false;
  if(!r.flights.length && !r.stays.length) return false;
  return r.flights.every(f => f.date && f.depTime && (f.from || f.to)) && r.stays.every(st => st.checkInDate && st.checkOutDate);
}
async function readAll(){
  const u = S.upload; if(!u || u.status === "reading") return;
  const files = u.files || [], pasted = s_(u.text);
  if(!files.length && !pasted){ u.status = "error"; u.err = errCopy("empty"); render(); return; }
  if(!files.length && pasted.replace(/\s/g,"").length < 30){ u.status = "error"; u.err = errCopy("too_short"); render(); return; }
  u.status = "reading"; u.err = ""; u.step = "กำลังเตรียมไฟล์…"; u.ctl = new AbortController();
  render();
  const signal = u.ctl.signal;
  try{
    const prepared = [];
    for(const f of files){ prepared.push(await prepFile(f)); if(signal.aborted) throw {code:"cancelled"}; }
    // keep the booking files in Drive while the AI reads them
    const uploads = prepared.map((p, i) => api("uploadFile", {name:files[i].name || "booking", mime:p.mime, data:p.data}).then(r => r.id).catch(() => null));
    setStep("กำลังอ่านใบจอง…");
    const t = S.trip;
    const res = await api("readBooking", {kind:u.kind, trip:{name:t.name, destination:t.destination, startDate:t.startDate, days:t.days},
      files:prepared, text:pasted}, signal);
    const r = buildReview(u.kind, res);
    if(!r.flights.length && !r.stays.length) throw {code:"nothing"};
    r.fileName = files.length ? files.map(f => f.name).join(", ") : "ข้อความที่วาง";
    setStep("กำลังเก็บใบจอง…");
    r.fileSlots = await Promise.all(uploads);           // Drive id per attached file, in order (null if that upload failed)
    r.fileIds = r.fileSlots.filter(Boolean);
    r.sourceText = pasted ? pasted.slice(0, 30000) : "";
    S.review = r;
    if(autoSaveable(r)) { await saveReview(true); return; }
    u.status = "idle";
    go("review");
  } catch(e){
    if(e && e.code === "cancelled"){ u.status = "idle"; }
    else { u.status = "error"; u.err = errCopy(e && e.code); }
    render();
  }
}

/* ---------- saving ---------- */
async function saveReview(auto){
  const r = S.review, t = S.trip; if(!r || !t) return;
  const base = {createdBy:S.me, createdAt:Date.now(), source:r.fileName ? "upload" : "manual"};
  // each flight or stay keeps only the files it was read from; if the reader did not say, it keeps them all
  const idsFor = x => {
    const own = (x.files||[]).map(i => (r.fileSlots||[])[i]).filter(Boolean);
    return own.length ? own : (r.fileIds||[]);
  };
  if(r.sourceText) base.sourceText = r.sourceText;
  const docs = [];
  const flightDoc = makeFlightDoc;
  const _unused = f => ({type:"flight", date:f.date, time:f.depTime,
    title:`บิน ${f.fromCity||f.from||"?"} → ${f.toCity||f.to||"?"}`,
    sub:[`${f.airline} ${f.flightNo}`.trim(), f.arrTime ? `ถึง ${f.arrTime}` : ""].filter(Boolean).join(" · "),
    data:{airline:f.airline, flightNo:f.flightNo, from:f.from, to:f.to, fromCity:f.fromCity, toCity:f.toCity, arrTime:f.arrTime, passengers:f.passengers, bookingRef:f.bookingRef}});
  const updates = [];
  const fresh = mergeFlights(r.flights.filter(f => f.from || f.to || f.flightNo || f.date)).out;
  for(const f of fresh){
    const k = flightKey(f);
    const old = k && S.items.find(i => i.type === "flight" && flightKey({...(i.data||{}), date:i.date, depTime:i.time}) === k);
    if(old){
      const prev = {...(old.data||{}), date:old.date, depTime:old.time};
      const m = mergeInto(prev, f);
      const patch = flightDoc(m);
      const ids = [...new Set([...(old.fileIds||[]), ...(old.fileId ? [old.fileId] : []), ...idsFor(f)])];
      if(ids.length) patch.fileIds = ids;
      if(r.sourceText && !old.sourceText) patch.sourceText = r.sourceText;
      updates.push({id:old.id, patch});
    } else { const ids = idsFor(f); docs.push({...base, ...flightDoc(f), ...(ids.length ? {fileIds:ids} : {})}); }
  }
  for(const st of r.stays){
    if(!st.name && !st.checkInDate) continue;
    const sIds = idsFor(st);
    docs.push({...base, ...(sIds.length ? {fileIds:sIds} : {}), type:"stay", date:st.checkInDate, time:st.checkInTime, endDate:st.checkOutDate, endTime:st.checkOutTime,
      title:st.name || "ที่พัก", sub:"", data:{address:st.address, phone:st.phone||"", website:st.website||"", rooms:st.rooms, guests:st.guests, bookingRef:st.bookingRef || r.bookingRef}});
  }
  if(!docs.length && !updates.length){ toast("ยังไม่มีข้อมูลให้บันทึก"); return; }
  S.saving = true; if(!auto) render();
  try{
    for(const d of docs) await store.addItem(t.id, d);
    for(const u of updates) await store.updateItem(t.id, u.id, u.patch);
    S.saving = false; S.review = null; S.upload = null;
    const first = [...docs, ...updates.map(u => u.patch)].map(d => d.date).filter(Boolean).sort()[0]; const idx = tripDates(S.trip || t).indexOf(first); if(idx >= 0) S.day = idx;
    const nF = docs.filter(d => d.type === "flight").length, nS = docs.length - nF;
    go("trip");
    toast(["บันทึกแล้ว", nF ? `${nF} เที่ยวบิน` : "", nS ? `${nS} ที่พัก` : "", updates.length ? `รวมกับเที่ยวบินเดิม ${updates.length}` : ""].filter(Boolean).join(" "));
  } catch(e){ S.saving = false; if(S.upload) S.upload.status = "idle"; if(auto) go("review"); else render(); fail(e); }
}

/* ---------- join ---------- */
async function startJoin(code){
  code = String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)){ toast("รหัสทริปมี 6 ตัวอักษร"); return; }
  S.joinTrip = null; S.joinMissing = false; go("join");
  try{
    const t = await store.fetchTrip(code);
    if(!t){ S.joinMissing = true; render(); return; }
    if((t.memberIds||[]).includes(S.me)){ C.trips[t.id] = t; if(!C.myTrips.includes(t.id)) C.myTrips.unshift(t.id); emit(); openTrip(t.id); return; }
    S.joinTrip = t; render();
  } catch(e){ S.joinMissing = true; S.joinErr = e && e.code; render(); }
}
async function confirmJoin(){
  const t = S.joinTrip; if(!t) return;
  try{
    await store.joinTrip(t.id);

  } catch(_){}
}

  setSession(sess && sess.token ? sess : null);
  unsubTrips = store.watchMyTrips(list => { S.trips = list; if(S.view === "home") softRender(); });
  const refresh = () => { checkUpdate(); if(!S.token) return; flush(); if(S.view !== "home" && S.tripId && !busyForm()) refreshTrip(S.tripId); else if(S.view === "home") refreshTrips(); };
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); });
  window.addEventListener("online", () => {updateSync();flush();});
  window.addEventListener("offline", updateSync);
  setInterval(refresh, 60000);
  flush();
  checkUpdate();
  const m = (location.hash || "").match(/^#join-([A-Za-z0-9]{6})$/);
  let add = ""; try { add = new URLSearchParams(location.search).get("add") || ""; } catch(_){}
  if(!add){ const h = (location.hash || "").match(/^#add=(.+)$/); if(h) try { add = decodeURIComponent(h[1]); } catch(_){} }
  const addUrl = (String(add).match(MAPS_LINK) || [])[0] || "";
  if(addUrl){ try { history.replaceState(null, "", location.pathname); } catch(_){} }
  // drop the invite part of the address straight away, so a refresh, bookmark or home-screen icon opens the trip list
  if(location.hash){ try { history.replaceState(null, "", location.pathname); } catch(_){} }
  if(!S.token){ S.pendingJoin = m ? m[1] : null; S.pendingAdd = addUrl; go("login"); return; }
  if(m) startJoin(m[1]);
  else if(addUrl){ go("home"); waitTrips(() => addFromLink(addUrl)); }
  else go("home");
})();
})();
</script>
