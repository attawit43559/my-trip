<style>
/* Layout: one centred phone column; each screen is a stack of white cards on a soft grey ground, one yellow accent for primary actions */
:root{
  --bg:#FFFDF9; --surface:#FFFFFF; --tile:#F6F1EA; --ink:#2B211C; --muted:#6E6259; --line:#EFE9E0; --lift:0 1px 3px rgba(43,33,28,.08);

  --place:#358834; --place-soft:#E2F5E2; --place-mid:#4CC24A;
  --move:#18767F; --move-soft:#DCF1F3; --move-mid:#22A9B5;
  --idea:#8A5300; --idea-soft:#FFF1CC; --idea-mid:#FFB020;

}

  --accent:#F2A516; --accent-soft:#3A2C12; --accent-line:#A9740C; --warn-bg:#3A2C12; --on-accent:#2B211C; --danger:#FF7A6B;
  --flight:#FFB98A; --flight-soft:#44291A; --flight-mid:#F2802F;
  --stay:#D9B5EC; --stay-soft:#36263F; --stay-mid:#9B5BC0;
  --place:#9DDD9B; --place-soft:#2E4325; --place-mid:#4CC24A;
  --move:#85D0D6; --move-soft:#243D3D; --move-mid:#22A9B5; --idea:#FFD27A; --idea-soft:#3A2C12; --idea-mid:#F2A516; --ai:#94BFFF; --ai-soft:#2A374D; --ai-mid:#3D8BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --lift:none; --bg:#1A1512; --surface:#251F1B; --tile:#312924; --ink:#F6EFE7; --muted:#B9AA9C; --line:#3A312B;
  --accent:#F2A516; --accent-soft:#3A2C12; --accent-line:#A9740C; --warn-bg:#3A2C12; --on-accent:#2B211C; --danger:#FF7A6B;
  --flight:#FFB98A; --flight-soft:#44291A; --flight-mid:#F2802F;
  --stay:#D9B5EC; --stay-soft:#36263F; --stay-mid:#9B5BC0;

html,body{min-height:100%}
/* white cards on a near-white page: a hairline shadow keeps them apart */
.card,.cat-card,.day-list,.list-row,.hero,.stepper-card,.cal .tab:not(.out):not(.past),.screen>.top .round,.home-top .me-btn{box-shadow:var(--lift)}
.screen .fld input,.screen .fld select,.join-row input{box-shadow:inset 0 0 0 1px var(--line)}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Match the installed app canvas without changing content position or viewport. */
@media (display-mode:standalone){:root{background:var(--bg)}}
[hidden]{display:none!important}
img{max-width:100%}

.av+.av{margin-left:-8px}

.join-row{display:flex;gap:8px}
.join-row input{flex:1;min-width:0;height:50px;border-radius:16px;border:0;background:var(--surface);padding:0 16px;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.join-row input::placeholder{letter-spacing:0;text-transform:none;color:var(--muted)}
.join-row button{height:50px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);padding:0 18px;font-weight:500;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px}
.empty svg.art{width:150px;height:90px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0}
.fld input,.fld select{height:52px;border-radius:16px;border:0;background:var(--surface);padding:0 16px;font-size:16px;font-weight:400;width:100%;min-width:0}
.card .fld input,.card .fld select,.sheet .fld input,.sheet .fld select{background:var(--tile)}
.fld.sm{font-size:12px;font-weight:400;color:var(--muted)}
.fld.sm input,.fld.sm select{height:46px;border-radius:14px;padding:0 12px;font-size:15px;color:var(--ink)}
.fld.warn input{background:var(--warn-bg);box-shadow:inset 0 0 0 2px var(--accent-line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .full{grid-column:1/-1}
.grid2>*{min-width:0}

.fld input[type=date]::-webkit-date-and-time-value,.fld input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.3em}

.fld.sm input[type=date],.fld.sm input[type=time]{padding-top:10px;padding-bottom:10px}
.fld input[type=date]::-webkit-date-and-time-value,.fld input[type=time]::-webkit-date-and-time-value{line-height:22px;min-height:22px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:8px}

.tab b{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.drop{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px 26px;border-radius:28px;border:2px dashed var(--accent-line);background:var(--accent-soft);text-align:center;cursor:pointer}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

#gbtn{min-height:44px;display:flex;justify-content:center}
.new-btn{height:44px;padding:0 16px 0 12px;border-radius:999px;border:0;box-shadow:none;background:var(--accent-soft);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:15px;flex:none}
.eyebrow{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.trow{position:relative;overflow:hidden}
.trow.big{border-radius:28px}

.trow.big.open .trow-slide,.trow.small.open .trow-slide{transform:translateX(-88px)}
.trow-actions{position:absolute;top:0;right:0;bottom:0;width:88px;display:flex}

.erow{--w:108px}
.erow .trow-actions{width:var(--w);align-items:center;justify-content:flex-end;gap:8px;padding-right:12px;background:var(--surface)}
.trow.big.erow .trow-actions,.trow.small.erow .trow-actions{background:transparent;padding-right:4px}
.sw-btn{width:40px;height:40px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sw-edit{background:var(--tile);color:var(--ink)}
.sw-del{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.sw-yes{width:auto;padding:0 16px;background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);font-size:14px;font-weight:600}
.trow.erow.open .trow-slide{transform:translateX(calc(-1 * var(--w)))}
.day-list{overflow:hidden}
.day-list .erow,.cat-list .erow{list-style:none}
.dock-body .erow .trow-slide{background:var(--surface)}
.day-list.day-list{padding:2px 0}
.day-list li+li{border-top:0}
.day-list li+li::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line);z-index:1;pointer-events:none}
.reorderable-entry{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:grab}.day-list:has(.place-placeholder){border-radius:0;box-shadow:none;border-color:transparent}.day-list .place-placeholder{border-radius:0;background:transparent!important;outline:0;border:0;box-shadow:none}.day-list .place-placeholder::before{display:none}.place-placeholder>*{visibility:hidden}.place-floating{position:fixed;left:0;top:0;z-index:10000;pointer-events:none;background:var(--surface);border-radius:18px;box-shadow:0 14px 36px rgba(43,33,28,.24),0 2px 8px rgba(43,33,28,.14);outline:1px solid var(--line);overflow:hidden;will-change:transform;animation:placeLift .12s ease-out}.place-floating .entry{padding:14px 16px;width:100%;cursor:grabbing}.place-floating .sw-btn{display:none}@keyframes placeLift{from{opacity:.7;box-shadow:0 2px 6px rgba(43,33,28,.1)}to{opacity:1}}

.day-list .entry{padding-left:16px;padding-right:16px}
.cat-list.cat-list{padding:0}
.cat-list .cat-row{padding-left:4px;padding-right:4px}
.trow-slide{position:relative;background:var(--surface);transition:transform .22s ease;touch-action:pan-y;will-change:transform}
.trow.dragging .trow-slide{transition:none}
.trow.open .trow-slide,.trow:has(.swipe-del:focus-visible) .trow-slide{transform:translateX(-88px)}
@media (prefers-reduced-motion: reduce){.trow-slide{transition:none}}
.badge{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;flex:none}
.badge b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;display:flex}
.badge span{font-size:10px}
.badge.past{background:var(--tile)}
.badge.now{background:var(--accent)}
.badge.now span,.badge.now b{color:var(--on-accent)}
.more{width:44px;height:44px;border-radius:999px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.menu{display:flex;flex-direction:column;background:var(--tile);border-radius:18px;padding:4px 14px}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;border:0;background:none;text-align:left;font-weight:500}
.menu button+button{border-top:1px solid var(--line)}
.menu .danger{color:var(--danger)}
/* trip info lives in a floating bar at the bottom: it slides away while scrolling down, comes back on the way up, and opens upward when a tab is tapped */
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px) + var(--kb,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;z-index:16;
  background:var(--surface);border-radius:22px;padding:6px;
  box-shadow:0 6px 24px rgba(43,33,28,.16),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .28s ease,opacity .28s ease,bottom .2s ease-out}
/* while typing, the tab row steps aside so the panel gets the room */

.dock .seg{background:transparent;padding:0}
.dock-body{overflow-y:auto;overscroll-behavior:contain;min-height:0}

.dock.open{box-shadow:0 -4px 40px rgba(43,33,28,.22),0 0 0 1px var(--line)}
@keyframes dockUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.dock,.dock-panel,.dock-scrim{transition:none;animation:none}}
.screen.has-dock{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:3px;padding:3px;border-radius:14px;background:var(--tile)}
.seg button{position:relative;min-height:44px;border:0;border-radius:11px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:500;color:var(--muted);padding:4px 1px;min-width:0}

.cat-list{list-style:none;margin:0;padding:0 4px}

.cat-row .grow{color:var(--ink)}
.cat-row .ttl{font-weight:500;font-size:14px}

.trip-top{position:sticky;top:0;z-index:12;display:flex;flex-direction:column;gap:10px;background:var(--bg);margin:calc(-12px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.pin-cal .cal{margin:0}
.cal-nav{display:flex;align-items:center;gap:6px;min-height:34px}
.cal-label{flex:1;display:flex;align-items:baseline;justify-content:center;gap:8px;font-weight:600;font-size:15px}
.cal-label small{font-size:12px;font-weight:400;color:var(--muted)}
.cal.open .cal-label{justify-content:flex-start;padding-left:4px}
.cal-arrow{width:34px;height:34px;border:0;border-radius:12px;background:var(--tile);color:var(--ink);display:grid;place-items:center;padding:0}
.cal-arrow.fwd .ic{transform:scaleX(-1)}
.cal-arrow:disabled{opacity:.35}
.cal-all{border:0;border-radius:999px;background:var(--tile);color:var(--ink);font:inherit;font-size:13px;height:34px;padding:0 10px 0 12px;display:inline-flex;align-items:center;gap:2px}
.cal-all .ic{transform:rotate(90deg);transition:transform .2s}
.cal.open .cal-all .ic{transform:rotate(-90deg)}
.cal.open .tabs{max-height:min(46vh,330px);overflow-y:auto;overscroll-behavior:contain}
.help-note{width:100%;min-width:0;border:0;border-radius:16px;background:var(--tile);color:var(--ink);padding:12px 14px;font:inherit;font-size:15px;line-height:1.45;resize:none}
.help-note::placeholder{color:var(--muted)}
.help-note:focus{outline:none;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.help-day-wait{padding:26px 0}
.help-none{margin:4px 0}
.help-adds{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.help-adds li{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:6px 6px 6px 10px;min-height:40px}
.ha-time{font-size:12.5px;color:var(--muted);width:38px;text-align:center;font-variant-numeric:tabular-nums}
.ha-ic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--deep)}
.ha-t{font-size:14px;line-height:1.35}
.ha-add{border:0;width:32px;height:32px;border-radius:10px;background:var(--place-soft);color:var(--place);display:grid;place-items:center}
.ha-ok{width:32px;height:32px;display:grid;place-items:center;color:var(--place)}
.help-done{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12.5px;color:var(--place);font-weight:600}
.help-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help-actions .soft-btn{background:var(--tile);color:var(--ink)}
.help-actions .soft-btn:last-child{background:var(--ai-soft);color:var(--ai)}
</style>

const pad = n => String(n).padStart(2,"0");

function rangeLabel(t){
  if(!validD(t.startDate)) return "ยังไม่มีวันที่";

/* trips made without dates take their span from the flights and stays in them */

/* the trip's days: its bookings, widened by the rough dates typed when there were no bookings yet */

  ds.sort();

}

}
async function refreshTrips(){

    const list = await api("myTrips");
    const waiting = new Set(C.outbox.filter(o => o.action === "saveTrip").map(o => o.body.trip.id));
    const gone = new Set(C.outbox.filter(o => o.action === "deleteTrip" || o.action === "leaveTrip").map(o => o.body.id));
    list.forEach(t => { if(!waiting.has(t.id)) C.trips[t.id] = t; else if(C.trips[t.id]) Object.assign(C.trips[t.id], {memberIds:t.memberIds, members:t.members, ownerId:t.ownerId}); });
    const ids = list.map(t => t.id).filter(id => !gone.has(id));
    C.myTrips = [...C.myTrips.filter(id => waiting.has(id) && !ids.includes(id)), ...ids];

async function refreshTrip(id){

    if(!C.outbox.some(o => o.action === "saveTrip" && o.body.trip.id === id)) C.trips[id] = r.trip;
    else if(C.trips[id]){ const t = C.trips[id]; t.memberIds = r.trip.memberIds; t.members = r.trip.members; t.ownerId = r.trip.ownerId; }   // who's in the trip always comes from the server

/* files go to the AI and to Drive as base64; photos are shrunk first */
const fileToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function shrinkImage(blob, maxSide){
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));

}
async function prepFile(f){

    return {mime:"application/pdf", data: await fileToB64(f)};
  }

  return {mime:"image/jpeg", data: await fileToB64(small)};
}

function orderedDayPlaces(date){
  const base=S.items.filter(i=>i.type==='place'&&i.date===date).sort((a,b)=>String(a.time||'99').localeCompare(String(b.time||'99'))||Number(a.createdAt||0)-Number(b.createdAt||0)||a.id.localeCompare(b.id));
  const index=new Map(base.map((i,n)=>[i.id,n]));
  const saved=S.trip?.dayRowOrder?.[date];if(Array.isArray(saved)){const rank=i=>{const at=saved.indexOf(JSON.stringify([i.id,'']));return at<0?saved.length+index.get(i.id):at;};return base.sort((a,b)=>rank(a)-rank(b));}
  return base.sort((a,b)=>(Number.isFinite(a.data?.dayOrder)?a.data.dayOrder:index.get(a.id))-(Number.isFinite(b.data?.dayOrder)?b.data.dayOrder:index.get(b.id)));

function dayOrderPending(date){return S.items.some(i=>i.type==='place'&&i.date===date&&i.data?.orderPending);}
function dayEntryKey(e){return JSON.stringify([e.it.id,e.phase||'']);}
function saveDayRowOrder(date,keys,tripId){

  const rows=dayEntries(date).filter(e=>!e.night&&!e.start),current=rows.map(dayEntryKey),known=new Set(current);   // the 'leaving the hotel' row is not dragged
  if(keys.length!==current.length||new Set(keys).size!==keys.length||keys.some(k=>!known.has(k))){toast('รายการเปลี่ยนไปแล้ว ลองเรียงใหม่อีกครั้ง');render();return false;}
  if(keys.every((k,n)=>k===current[n])){render();return true;}
  const patch={dayRowOrder:{[date]:keys.slice()}};
  C.trips[tripId]=deepMerge(C.trips[tripId],patch);
  queue('saveTrip',{trip:{id:tripId,...patch}});emit();toast('เรียงรายการแล้ว');return true;
}
/* the stay whose nights cover the night of `date` (check-in ≤ date < check-out): where the group sleeps that night,
   and so where the next day starts. A stay saved without a check-out date (a booking the AI could not read fully)
   still counts, until the next stay's check-in or the trip's last day. */
function stayForNight(date){
  if(!validD(date)) return null;
  const stays = S.items.filter(i => i.type === "stay" && validD(i.date));
  const hit = stays.find(i => validD(i.endDate) && i.date <= date && date < i.endDate); if(hit) return hit;
  const open = stays.filter(i => !validD(i.endDate) && i.date <= date).sort((a, b) => a.date < b.date ? 1 : -1)[0];
  if(!open) return null;
  const nextIn = stays.filter(i => i.date > open.date).map(i => i.date).sort()[0];
  const ds = S.trip ? tripDates(S.trip) : [], last = ds.length ? ds[ds.length - 1] : "";
  return (nextIn ? date < nextIn : (!last || date < last)) ? open : null;
}
function dayEntries(dateStr){
  const out = [];
  for(const it of S.items){
    if(it.type === "stay"){
      const sd = it.data || {};
      if(it.date === dateStr) out.push({it, phase:"in", time:it.time, title:"เช็กอิน " + (it.title||"ที่พัก"), sub:s_(sd.inNote)});
      if(it.endDate === dateStr) out.push({it, phase:"out", time:it.endTime, title:"เช็กเอาต์ " + (it.title||"ที่พัก"), sub:s_(sd.outNote)});
    } else {
      const d = it.data || {}, ad = it.type === "flight" ? arrDateOf(it) : "", split = ad && ad !== it.date;
      /* a flight's own notes: before departure on its row, after landing on the arrival row (or the same row when it lands that day) */
      const fNote = it.type === "flight" ? [s_(d.note), split ? "" : s_(d.arrNote)].filter(Boolean).join(" · ") : "";
      if(it.date === dateStr) out.push({it, phase:"", time:it.time, title:it.title, sub:subOf(it), note:fNote});
      if(it.type === "flight" && split && ad === dateStr)
        out.push({it, phase:"arr", time:d.arrTime, title:`ถึง ${d.toCity || d.to || "ปลายทาง"}`, sub:[s_(d.flightNo), `ออก ${it.time||"-"} (${dShort(it.date)})`].filter(Boolean).join(" · "), note:s_(d.arrNote)});
    }
  }
  out.sort((a,b) => (a.time||"99") < (b.time||"99") ? -1 : 1);
  const places=orderedDayPlaces(dateStr);let placeAt=0;out.forEach((e,n)=>{if(e.it.type==='place'){const it=places[placeAt++];out[n]={...e,it,time:it.time,title:it.title,sub:subOf(it),orderPending:dayOrderPending(dateStr)};}});
  const saved=S.trip?.dayRowOrder?.[dateStr];
  if(Array.isArray(saved)){
    const ranks=new Map(saved.map((key,n)=>[key,n])),base=new Map(out.map((e,n)=>[dayEntryKey(e),n]));
    out.sort((a,b)=>(ranks.has(dayEntryKey(a))?ranks.get(dayEntryKey(a)):saved.length+base.get(dayEntryKey(a)))-(ranks.has(dayEntryKey(b))?ranks.get(dayEntryKey(b)):saved.length+base.get(dayEntryKey(b))));
  }
  /* the hotel slept in last night opens the day. Its check-out row goes first when it has no time yet,
     or when a saved order from before it existed would leave it at the bottom; a timed check-out keeps its place by time */
  const lastNight = stayForNight(addDays(dateStr, -1));
  if(lastNight){
    const k = out.findIndex(e => e.it.type === "stay" && e.phase === "out" && s_(e.it.title).toLowerCase() === s_(lastNight.title).toLowerCase());
    const ranked = k >= 0 && Array.isArray(saved) && saved.includes(dayEntryKey(out[k]));
    if(k > 0 && !ranked){
      const e = out.splice(k, 1)[0], t = /^\d\d:\d\d$/.test(e.time || "") ? e.time : "";
      const at = t ? out.findIndex(x => /^\d\d:\d\d$/.test(x.time || "") && x.time > t) : 0;
      out.splice(at < 0 ? out.length : at, 0, e);
    }
  }
  /* a travel leg with no time of its own goes just before the place it goes to (you travel, then check in) */
  for(const e of out.filter(x => x.it.type === "move" && !/^\d\d:\d\d$/.test(x.time || "") && !(Array.isArray(saved) && saved.includes(dayEntryKey(x))))){
    const to = s_((e.it.data || {}).to).toLowerCase(); if(!to) continue;
    const k = out.indexOf(e), dest = out.findIndex(x => x !== e && !x.night && x.it.type !== "move" && s_(x.it.title).toLowerCase() === to);
    if(dest >= 0 && dest < k){ out.splice(k, 1); out.splice(dest, 0, e); }
  }
  /* the day starts where we slept last night, unless that hotel's check-out or a landing already opens the day */
  const slept = stayForNight(addDays(dateStr, -1));
  const landing = out.some(e => e.it.type === "flight" && (e.phase === "arr" || (arrDateOf(e.it) === dateStr && e.it.date !== dateStr)));
  if(slept && !landing && !out.some(e => e.it.type === "stay" && s_(e.it.title).toLowerCase() === s_(slept.title).toLowerCase()))
    out.unshift({it:slept, phase:"start", start:true, time:s_((slept.data||{}).leave?.[dateStr]), title:"ออกจาก " + (slept.title || "ที่พัก"), sub:""});
  /* where everyone sleeps tonight: any stay whose nights cover this date (one row per hotel, even with two rooms or two bookings) */
  const sleptAt = new Set();
  for(const it of S.items){
    if(it.type === "stay" && validD(it.date) && (validD(it.endDate) ? it.date <= dateStr && dateStr < it.endDate : stayForNight(dateStr) === it) && !sleptAt.has(s_(it.title).toLowerCase()) && sleptAt.add(s_(it.title).toLowerCase()))
      out.push({it, phase:"night", night:true, time:"", title:"นอนที่ " + (it.title||"ที่พัก"), sub:""});
    if(it.type === "flight" && validD(it.date)){
      const ad = arrDateOf(it);
      if(validD(ad) && it.date <= dateStr && dateStr < ad)
        out.push({it, phase:"night", night:true, time:"", title:"นอนบนเครื่องบิน", sub:s_((it.data||{}).flightNo)});
    }
  }
  return out.map(e=>({...e,dayDate:dateStr}));
}

function arrDateOf(it){

/* ---------- booking files kept on the phone (IndexedDB) and opened in the app, also without internet ---------- */
const DOCS = {db:null, have:new Set(), busy:new Set(), el:null, elFor:"", urls:[]};
const itemFiles = it => [...new Set([...(it.fileIds || []), ...(it.fileId ? [it.fileId] : [])])];
function docsDb(){
  return DOCS.db || (DOCS.db = new Promise((ok, no) => { try { const r = indexedDB.open("mytrip-docs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch(e){ no(e); } }));
}
async function docGet(id){
  try { const db = await docsDb(); return await new Promise(ok => { const q = db.transaction("files").objectStore("files").get(id); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
  catch(_){ return null; }
}
async function docPut(id, rec){
  try { const db = await docsDb(); await new Promise(ok => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(rec, id); tx.oncomplete = ok; tx.onerror = ok; }); DOCS.have.add(id); } catch(_){}
}
async function docKeys(){
  try { const db = await docsDb(); return await new Promise(ok => { const q = db.transaction("files").objectStore("files").getAllKeys(); q.onsuccess = () => ok(q.result || []); q.onerror = () => ok([]); }); }
  catch(_){ return []; }
}
async function docFetch(tripId, id){

/* every booking file of the open trip is kept on the phone, quietly, while there is internet */

/* ---------- today: where you are in the day ---------- */
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

/* the next thing with a start time that has not started yet (travel without its own time is skipped) */
function nextEntry(entries){
  const now = hmMin(nowHM());
  return entries.find(e => !e.night && hmMin(e.time) != null && hmMin(e.time) >= now) || null;
}
function inMin(t){
  const m = hmMin(t) - hmMin(nowHM()); if(m <= 0) return "ตอนนี้";
  return m < 60 ? `อีก ${m} นาที` : `อีก ${Math.floor(m / 60)} ชม.${m % 60 ? ` ${m % 60} น.` : ""}`;
}

/* ---------- weather for each day (Open-Meteo, no key), about 16 days ahead ---------- */
const WX_KEY = "mytrip-wx";

/* where a day is: its places, else the hotel that night, else anywhere in the trip, else the trip's name looked up */
function wxSpot(date){
  const has = i => i.data && i.data.lat !== "" && i.data.lat != null && isFinite(+i.data.lat) && isFinite(+i.data.lon);
  const p = S.items.find(i => i.type === "place" && i.date === date && has(i))
    || S.items.find(i => i.type === "stay" && i.date <= date && (i.endDate || i.date) >= date && has(i))
    || S.items.find(i => ["place", "stay", "idea"].includes(i.type) && has(i));
  if(p) return {lat:+(+p.data.lat).toFixed(2), lon:+(+p.data.lon).toFixed(2)};

}
const wxName = () => String((S.trip && (S.trip.destination || S.trip.name)) || "").replace(/\d{4}|\d+\s*(วัน|days?)/gi, "").replace(/ทริป|trip/gi, "").trim();
async function wxLoad(){

    try { const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(name)).then(r => r.json());
      const g = (r.results || [])[0]; WX.geo[name] = g ? {lat:+g.latitude.toFixed(2), lon:+g.longitude.toFixed(2)} : {lat:null}; wxSave(); } catch(_){ return; }

      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=16`).then(r => r.json());

/* trip days laid out as a Sunday-first calendar, 7 per row */
/* trip days laid out as a Sunday-first calendar, 7 per row.
   A long trip (more than two weeks) shows one week at a time: arrows or a swipe move between weeks,
   and "ทั้งหมด" opens the whole calendar until a day is picked */
function calendar(dates){
  const first = dates[0], last = dates[dates.length-1];
  const lead = parseD(first).getDay();
  const before = Array.from({length:lead}, (_,k) => addDays(first, k - lead));
  const trail = (7 - (lead + dates.length) % 7) % 7;
  const after = Array.from({length:trail}, (_,k) => addDays(last, k + 1));
  const out = x => `<span class="tab out" aria-hidden="true"><b>${parseD(x).getDate()}</b></span>`;
  const cells = [...before.map(out), ...dates.map((x,i) => `<button class="tab${x < today() ? " past" : ""}" role="tab" aria-selected="${i===S.day}" aria-label="วันที่ ${i+1} ${esc(dLong(x))}${x < today() ? " ผ่านไปแล้ว" : ""}" data-act="day" data-i="${i}"><b>${parseD(x).getDate()}</b>${parseD(x).getDate()===1 || i===0 ? `<span>${MON[parseD(x).getMonth()]}</span>` : ""}</button>`), ...after.map(out)];
  const weeks = Math.ceil(cells.length / 7), long = dates.length > 14;
  const head = `<div class="cal-head" aria-hidden="true">${DOW.map(d => `<span>${d}</span>`).join("")}</div>`;
  if(!long) return `<div class="cal">${head}<div class="tabs" role="tablist" aria-label="เลือกวัน">${cells.join("")}</div></div>`;
  const dayWeek = Math.floor((lead + S.day) / 7);
  const w = Math.max(0, Math.min(weeks - 1, S.calWeek ?? dayWeek));
  const open = !!S.calOpen;
  // the label: the dates this week covers (trip days only)
  const inWeek = dates.filter((_, i) => Math.floor((lead + i) / 7) === w), a0 = parseD(inWeek[0]), a1 = parseD(inWeek[inWeek.length - 1]);
  const span = a0.getMonth() === a1.getMonth() ? `${a0.getDate()}–${a1.getDate()} ${MON[a1.getMonth()]}` : `${a0.getDate()} ${MON[a0.getMonth()]} – ${a1.getDate()} ${MON[a1.getMonth()]}`;
  const nav = `<div class="cal-nav">
      ${open ? `<span class="cal-label">ทั้งหมด ${dates.length} วัน</span>` : `<button type="button" class="cal-arrow" data-act="cal-week" data-d="-1" ${w ? "" : "disabled"} aria-label="สัปดาห์ก่อน">${ic("back",18)}</button>
      <span class="cal-label">${esc(span)}<small>สัปดาห์ ${w + 1}/${weeks}</small></span>
      <button type="button" class="cal-arrow fwd" data-act="cal-week" data-d="1" ${w < weeks - 1 ? "" : "disabled"} aria-label="สัปดาห์ถัดไป">${ic("back",18)}</button>`}
      <button type="button" class="cal-all" data-act="cal-open" aria-expanded="${open}">${open ? "ย่อ" : "ทั้งหมด"}${ic("chev",14)}</button>
    </div>`;
  const shown = open ? cells : cells.slice(w * 7, w * 7 + 7);
  return `<div class="cal long${open ? " open" : ""}">${nav}${head}<div class="tabs" role="tablist" aria-label="เลือกวัน">${shown.join("")}</div></div>`;
}
function vTrip(){

function manualTravelLegs(date){
  const entries=dayEntries(date),points=[];
  const arrival=entries.some(e=>!e.night&&e.it.type==='flight'&&(e.phase==='arr'||(arrDateOf(e.it)===date&&e.it.date!==date)));
  const hotel=!arrival&&stayForNight(addDays(date,-1));
  if(hotel)points.push({id:hotel.id,name:hotel.title,key:''});
  for(const e of entries){
    const it=e.it,d=it.data||{};if(!['place','stay','flight'].includes(it.type)||(e.night&&it.type!=='stay'))continue;
    const names=it.type==='flight'?(e.phase==='arr'?[[d.to,d.toCity]]:[[d.from,d.fromCity],...(arrDateOf(it)===date?[[d.to,d.toCity]]:[])]).map(parts=>parts.filter(Boolean).join(' ')):[it.title];
    for(const name of names){if(!name)continue;const point={id:it.id,name,key:e.night?'':dayEntryKey(e)};
      if(points.at(-1)?.id===point.id&&points.at(-1)?.name===point.name)continue;points.push(point);
    }
  }
  return points.slice(1).map((to,i)=>{const from=points[i],key=JSON.stringify([from.id,from.name,to.id,to.name]);
    const saved=S.items.find(m=>m.type==='move'&&m.date===date&&((m.data||{}).legKey===key||((m.data||{}).from===from.name&&(m.data||{}).to===to.name)));
    return {date,key,from:from.name,to:to.name,fromId:from.id,toId:to.id,afterKey:from.key,beforeKey:to.key,saved};
  }).filter(l=>l.fromId!==l.toId&&s_(l.from).toLowerCase()!==s_(l.to).toLowerCase());   // no travel between two bookings of the same hotel
}

}
function travelTimezone(leg){

function travelDepartureHint(leg){

function travelResultMatches(s,r){
  if(!r||r.date!==s.date||r.time!==s.time||r.timezone!==s.timezone)return false;
  return (r.routes||[]).every(route=>{
    if(!route.scheduled)return true;
    if(!route.departureAt||!r.requestedDepartureAt)return false;
    const actual=new Date(route.departureAt),requested=new Date(r.requestedDepartureAt);if(!Number.isFinite(+actual)||!Number.isFinite(+requested)||+actual<+requested-60000)return false;

    return parts.year+'-'+parts.month+'-'+parts.day===s.date;
  });
}

async function planCall(s, action, body, isCurrent=()=>S.help===s){

/* step 1: AI drafts which places go on which day */
/* step 2: times and travel for the places in the order chosen; wish = a request for the day being viewed */
/* Travel time changes keep reservations fixed and absorb spare time before them. */
function travelMinutes(x){
  if(Number.isFinite(+x.durationMinutes) && +x.durationMinutes>0)return +x.durationMinutes;
  const note=String(x.note||x.sub||'');
  const h=note.match(/(\d+(?:\.\d+)?)\s*(?:ชั่วโมง|ชม\.?|hours?|hrs?)/i),m=note.match(/(\d+)\s*(?:นาที|mins?|minutes?)/i);
  return h||m ? Math.round((h?+h[1]*60:0)+(m?+m[1]:0)) : 30;
}
function minute(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60 + +m[2]:-1;}
function clockTime(n){return pad(Math.floor(n/60))+':'+pad(n%60);}
function changeTravel(day,index,option){
  const items=JSON.parse(JSON.stringify(day.items)),old=items[index];
  if(!old||old.type!=='move')return {error:'ไม่พบช่วงเดินทาง'};
  const before=travelMinutes(old),after=travelMinutes(option);
  if(minute(old.time)<0||minute(old.time)+after>1439)return {error:"ตารางเกินหนึ่งวัน กรุณาลดสถานที่หรือเปลี่ยนวิธีเดินทาง"};
  old.mode=option.mode;old.note=option.note;old.durationMinutes=after;
  let shift=after-before,ready=minute(old.time)+after;
  for(let i=index+1;i<items.length;i++){
    const x=items[i],was=minute(x.time),end=minute(x.until),duration=x.type==='move'?travelMinutes(x):Math.max(1,end>was?end-was:60);
    let at=was+shift;
    if(x.inside){at=Math.max(0,at);}else at=Math.max(ready,at);
    if(x.lockedTime){
      const lock=minute(x.lockedTime);
      if(lock<0||ready>lock)return {error:'ไปไม่ทัน '+x.title+' ที่ล็อกไว้ '+x.lockedTime+' ลองเลือกการเดินทางที่เร็วขึ้นหรือลดจุดก่อนหน้า'};
      at=lock;shift=0;
    }else shift=at-was;
    if(at<0||at+duration>1439)return {error:'ตารางเกินหนึ่งวัน กรุณาลดสถานที่หรือเปลี่ยนวิธีเดินทาง'};
    x.time=clockTime(at);if(x.type==='place')x.until=clockTime(at+duration);
    ready=Math.max(ready,at+duration);
  }
  if(day.deadline!=null&&day.deadline>=0&&ready>day.deadline)return {error:'ไปสนามบินไม่ทันเวลาเผื่อ 3 ชั่วโมง ลองเลือกการเดินทางที่เร็วขึ้น'};
  let previous=-1;
  for(const x of items){
    const at=minute(x.time);
    if(x.lockedTime && at!==minute(x.lockedTime))return {error:'เวลาจองถูกเปลี่ยน กรุณาจัดแผนใหม่'};
    if(!x.inside && at<previous)return {error:'ตารางยังทับกันก่อนช่วงที่เลือก กรุณาปรับช่วงเดินทางก่อนหน้า'};
    if(!x.inside)previous=at+(x.type==='move'?travelMinutes(x):Math.max(1,minute(x.until)-at));
  }
  return {items,conflicts:[]};
}

async function saveReview(auto){
  const r = S.review, t = S.trip; if(!r || !t) return;
  if(r.tripId&&r.tripId!==t.id||r.ownerMe&&r.ownerMe!==S.me){toast('ทริปหรือบัญชีเปลี่ยนแล้ว กรุณาเพิ่มข้อมูลใหม่');return;}
  const base = {createdBy:S.me, createdAt:Date.now(), source:r.fileName ? "upload" : "manual"};
  // each flight or stay keeps only the files it was read from; if the reader did not say, it keeps them all
  const idsFor = x => {
    const own = (x.files||[]).map(i => (r.fileSlots||[])[i]).filter(Boolean);
    return own.length ? own : (r.fileIds||[]);
  };
  if(r.sourceText) base.sourceText = r.sourceText;
  const docs = [];
  const flightDoc = makeFlightDoc;
  const updates = [];
  const fresh = mergeFlights(r.flights.filter(f => f.from || f.to || f.flightNo || f.date)).out;
  for(const f of fresh){
    const k = flightKey(f);
    const old = k && S.items.find(i => i.type === "flight" && flightKey({...(i.data||{}), date:i.date, depTime:i.time}) === k);
    if(old){
      const prev = {...(old.data||{}), date:old.date, depTime:old.time};
      const m = mergeInto(prev, f);
      const patch = flightDoc(m);
      const ids = [...new Set([...(old.fileIds||[]), ...(old.fileId ? [old.fileId] : []), ...idsFor(f)])];
      if(ids.length) patch.fileIds = ids;
      if(r.sourceText && !old.sourceText) patch.sourceText = r.sourceText;
      updates.push({id:old.id, patch});
    } else { const ids = idsFor(f); docs.push({...base, ...flightDoc(f), ...(ids.length ? {fileIds:ids} : {})}); }
  }
  for(const st of r.stays){
    if(!st.name && !st.checkInDate) continue;
    const sIds = idsFor(st);
    docs.push({...base, ...(sIds.length ? {fileIds:sIds} : {}), type:"stay", date:st.checkInDate, time:st.checkInTime, endDate:st.checkOutDate, endTime:st.checkOutTime,
      title:st.name || "ที่พัก", sub:"", data:{address:st.address, phone:st.phone||"", website:st.website||"", rooms:st.rooms, guests:st.guests, bookingRef:st.bookingRef || r.bookingRef}});
  }
  if(!docs.length && !updates.length){ toast("ยังไม่มีข้อมูลให้บันทึก"); return; }
  S.saving = true; if(!auto) render();
  try{
    for(const d of docs) await store.addItem(t.id, d);
    for(const u of updates) await store.updateItem(t.id, u.id, u.patch);
    S.saving = false; S.review = null; S.upload = null;
    const first = [...docs, ...updates.map(u => u.patch)].map(d => d.date).filter(Boolean).sort()[0]; const idx = tripDates(S.trip || t).indexOf(first); if(idx >= 0) S.day = idx;
    const nF = docs.filter(d => d.type === "flight").length, nS = docs.length - nF;
    go("trip");
    toast(["บันทึกแล้ว", nF ? `${nF} เที่ยวบิน` : "", nS ? `${nS} ที่พัก` : "", updates.length ? `รวมกับเที่ยวบินเดิม ${updates.length}` : ""].filter(Boolean).join(" "));
  } catch(e){ S.saving = false; if(S.upload) S.upload.status = "idle"; if(auto) go("review"); else render(); fail(e); }
}

    case "ai-mode": { const g = el.closest(".ai-seg"); if(g){ g.style.setProperty("--i", el.dataset.k === "rec" ? 0 : 1); g.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b === el)); } S.aiMode = el.dataset.k; setTimeout(render, 300); break; }

    case "idea-suggest-like": {const s=recS();if(s?.kind==='idea-recommend'){const l=s.likes[s.cat]||(s.likes[s.cat]=[]),v=el.dataset.v;s.likes[s.cat]=l.includes(v)?l.filter(x=>x!==v):l.concat(v);render();}break;}

    case "idea-suggest-toggle": {const s=recS();if(s?.kind==='idea-recommend'&&s.step==='results'){const id=el.dataset.id;s.selected.has(id)?s.selected.delete(id):s.selected.add(id);keepScroll(".idea-suggest-results",render);}break;}

    case "clear-open": S.sheet = {kind:"clear", scope:"day"}; render(); break;

    case "clear-run": clearPlan();break;
    case "export-open": S.sheet = {kind:"export", scope:"day", files:null, busy:""}; render(); break;
    case "export-run": exportRun(el.dataset.k); break;
    case "export-share": exportShare(); break;
    case "item": {const it=S.items.find(i=>i.id===el.dataset.id);if(editManualTravel(it))break;S.sheet={kind:"item",id:el.dataset.id,confirm:false};render();break;}
    case "close-sheet": if(S.sheet?.kind==="doc"&&S.sheet.back){S.sheet=S.sheet.back;render();break;} S.sheet?.lookupCtl?.abort();S.sheet?.ctl?.abort();S.sheet = null; render(); break;
    case "doc-open": docOpen(el.dataset.id, Number(el.dataset.n) || 0); break;
    case "taxi-open": taxiOpen(el.dataset.id); break;
    case "sos-open": sosOpen(false); if(sosNeedsLocal()) sosLocalize(); sosAutoLoad(); break;
    case "sos-doctor": S.sheet = {kind:"sos-doctor"}; render(); break;
    case "sos-edit": sosOpen(true); break;
    case "sos-view": sosOpen(false); break;
    case "doc-file": if(S.sheet && S.sheet.kind === "doc"){ S.sheet.i = Number(el.dataset.n) || 0; S.sheet.state = "loading"; render(); docShow(); } break;
    case "sheet-cancel": S.sheet = null; render(); break;
    case "rm-ask": S.rmAsk = el.dataset.id; render(); break;
    case "rm-cancel": S.rmAsk = null; render(); break;
    case "rm-member": {
      const uid = el.dataset.id, tid = S.tripId; el.disabled = true;
      try{
        const trip = await api("removeMember", {id:tid, uid});
        if(trip) C.trips[tid] = Object.assign(C.trips[tid] || {}, {memberIds:trip.memberIds, members:trip.members});
        S.rmAsk = null; emit(); toast("ลบออกจากทริปแล้ว");
      } catch(e){ el.disabled = false; fail(e); }
      break;
    }
    case "sheet-confirm": S.sheet.confirm = true; render(); break;
    case "item-edit": { const it = S.items.find(i => i.id === S.sheet.id); if(it){if(editManualTravel(it))break;S.sheet.edit = editFromItem(it); render(); } break; }
    case "item-edit-cancel": if(S.sheet.fromSwipe) S.sheet = null; else S.sheet.edit = null; render(); break;
    case "entry-edit": {
      const it = S.items.find(i => i.id === el.dataset.id); S.swipeOpen = null; S.delAsk = null;
      if(it){if(editManualTravel(it))break;S.sheet = {kind:"item", id:it.id, edit:editFromItem(it), fromSwipe:true};render();}
      break; }
    case "idea-del": { const s = S.sheet; if(!s.delAsk){ s.delAsk = true; render(); break; } const id = s.id; S.sheet = null; try { await store.deleteItem(t.id, id); toast("ลบแล้ว"); } catch(err){ fail(err); } render(); break; }
    case "entry-del": S.delAsk = el.dataset.key; S.swipeOpen = el.dataset.key; render(); break;
    case "entry-del-yes": {
      S.swipeOpen = null; S.delAsk = null;
      try { await store.deleteItem(t.id, el.dataset.id); toast("ลบแล้ว"); } catch(err){ fail(err); render(); }
      break; }
    case "show-source": S.sheet.showText = true; render(); break;
    case "hide-source": S.sheet.showText = false; render(); break;
    case "sheet-confirm-no": S.sheet.confirm = false; render(); break;
    case "join-confirm": confirmJoin(); break;
    case "exp-open": S.sheet = null; selectTab("money"); break;
    case "exp-add": S.swipeOpen = null; S.delAsk = null; S.sheet = {kind:"exp-add", id:el.dataset.id || ""}; render(); setTimeout(() => { const f = document.getElementById("exp-amt"); if(f && !el.dataset.id) f.focus(); }, 60); break;
    case "exp-cur": { const f = el.closest("form"); segSlide(el); f.elements.cur.value = el.dataset.cur; f.elements.amount.focus(); break; }
    case "exp-view": try { localStorage.setItem("mytrip-exp-view", el.dataset.cur); } catch(_){} segSlide(el); setTimeout(render, 280); break;
    case "exp-del": if(S.sheet && S.sheet.id){ await store.deleteItem(S.trip.id, S.sheet.id); S.sheet = null; render(); toast("ลบแล้ว"); } break;
    case "exp-pick": { const o = (S.expUI ||= {pick:""}); o.pick = o.pick === el.dataset.id ? "" : el.dataset.id; render(); break; }
    case "exp-who": { const o = (S.expUI || {}); const it = S.items.find(i => i.id === o.pick); if(!it) break; const all = expPeople(), cur = new Set(expSplitOf(it, all)), u = el.dataset.u;
      if(cur.has(u)){ if(cur.size > 1) cur.delete(u); } else cur.add(u);
      await store.updateItem(S.trip.id, it.id, {data:{split: cur.size === all.length ? null : [...cur]}}); render(); break; }
    case "exp-line": { const txt = expPlanText(); try { await navigator.clipboard.writeText(txt); } catch(_){} location.href = "https://line.me/R/share?text=" + encodeURIComponent(txt); break; }
    case "exp-copy": { const t = expPlanText(); try { await navigator.clipboard.writeText(t); toast("คัดลอกแล้ว ส่งใน LINE ได้เลย"); } catch(_){ toast(t); } break; }
    case "start-install": if(INSTALL.prompt){ INSTALL.prompt.prompt(); INSTALL.prompt.userChoice.then(c => { if(c && c.outcome === "accepted"){ INSTALL.prompt = null; INSTALL.done = true; render(); } }).catch(() => {}); } else { S.sheet = {kind:"install"}; render(); } break;
    case "start-share": S.scOpen = true; S.sheet = {kind:"account"}; render(); aiStatusLoad(); break;
    case "start-skip": try { localStorage.setItem("mytrip-start-off", "1"); } catch(_){} render(); toast("ซ่อนแล้ว · เปิดอีกทีได้ที่รูปโปรไฟล์ มุมขวาบน"); break;
    case "start-back": try { localStorage.removeItem("mytrip-start-off"); } catch(_){} S.sheet = null; render(); break;
    case "account": S.sheet = {kind:"account"}; render(); aiStatusLoad(); docKeys().then(k => { k.forEach(x => DOCS.have.add(x)); if(S.sheet && S.sheet.kind === "account") render(); });
      if(S.shareKey === undefined) api("shareKey", {peek:true}).then(r => { S.shareKey = r && r.key || null; if(S.shareKey) try { localStorage.setItem("mytrip-share-on", "1"); } catch(_){} render(); }).catch(() => {});
      break;
    case "share-on": case "share-reset": {
      S.shareBusy = true; render();
      try { const r = await api("shareKey", {reset: a === "share-reset"}); S.shareKey = r.key; try { localStorage.setItem("mytrip-share-on", "1"); } catch(_){}
        if(S.tripId) api("shareTrip", {tripId:S.tripId}).catch(() => {}); toast(a === "share-reset" ? "สร้างรหัสใหม่แล้ว ต้องแก้รหัสในคำสั่งลัดด้วย" : "สร้างรหัสแล้ว"); }
      catch(e){ fail(e); }
      S.shareBusy = false; render(); break; }
    case "share-off": {
      try { await api("shareKeyOff"); S.shareKey = null; try { localStorage.removeItem("mytrip-share-on"); } catch(_){} toast("ปิดการแชร์แล้ว"); } catch(e){ fail(e); }
      render(); break; }
    case "detach": {
      const it = S.sheet && S.items.find(i => i.id === S.sheet.id); if(!it) break;
      const keep = [...new Set([...(it.fileIds||[]), ...(it.fileId ? [it.fileId] : [])])].filter(x => x !== el.dataset.file);
      store.updateItem(S.trip.id, it.id, {fileIds:keep, fileId:""}); toast("เอาใบจองออกแล้ว"); break;
    }
    case "logout": logout(); break;
    case "trip-menu": S.sheet = {kind:"trip-menu", id:el.dataset.id, confirm:false}; render(); break;
    case "menu-invite": openTrip(el.dataset.id, "invite"); break;
    case "trip-del-ask": S.delAsk = el.dataset.key; S.swipeOpen = el.dataset.key; render(); break;
    case "trip-delete": case "trip-leave": {
      const id = (S.sheet && S.sheet.id) || el.dataset.id;
      S.swipeOpen = null; S.delAsk = null;
      if(S.sheet){ S.sheet.busy = true; render(); } else { el.disabled = true; }
      try{
        if(a === "trip-delete") await store.deleteTrip(id);
        else await store.leaveTrip(id);
        if(S.tripId === id){ unsubTrip && unsubTrip(); unsubItems && unsubItems(); S.tripId = null; S.trip = null; S.items = []; }
        S.trips = S.trips.filter(x => x.id !== id);
        S.sheet = null; render(); toast(a === "trip-delete" ? "ลบทริปแล้ว" : "ออกจากทริปแล้ว");
      } catch(err){ if(S.sheet) S.sheet.busy = false; render(); fail(err); }
      break; }
    case "sc-tab": S.scTab = el.dataset.tab; render(); break;
    case "share-in-pick": shareInSend(el.dataset.name || ""); break;
    case "copy": {
      const text = el.dataset.text;
      try { await navigator.clipboard.writeText(text); toast("คัดลอกแล้ว"); }
      catch(_){ const i = document.getElementById("inv-link"); if(i){ i.focus(); i.select(); } toast("กดค้างที่ข้อความเพื่อคัดลอก"); }
      break; }
  }
});

/* ---------- sign-in ---------- */
const GOOGLE_CLIENT_ID = "469048508643-2k3ek7jap7j6sr0ns2t24sj8m9rao2ot.apps.googleusercontent.com";
const SESSION_KEY = "mytrip-session";
function setSession(sess){
  S.token = sess ? sess.token : null; S.user = sess ? sess.user : null;
  S.me = S.user ? S.user.uid : null; S.myName = S.user ? S.user.name : "";
}
let gisReady = false;
function mountGoogleButton(){
  const el = document.getElementById("gbtn");
  if(!el || el.childElementCount) return;
  if(!(window.google && google.accounts && google.accounts.id)){ setTimeout(mountGoogleButton, 300); return; }
  if(!gisReady){
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:onGoogleCredential, auto_select:true, cancel_on_tap_outside:false, use_fedcm_for_prompt:true});
    gisReady = true;
  }
  google.accounts.id.renderButton(el, {theme:"filled_blue", size:"large", shape:"pill", text:"signin_with", locale:"th", width:260});
  google.accounts.id.prompt();
}
async function onGoogleCredential(resp){
  S.loggingIn = true; S.loginErr = ""; render();
  let old = null; try { old = (JSON.parse(localStorage.getItem("mytrip-me")) || {}).id; } catch(_){}
  try{
    const r = await api("login", {idToken:resp.credential, claim:old || undefined});
    if(C.lastUser && C.lastUser !== r.user.uid){ C.trips = {}; C.items = {}; C.myTrips = []; C.outbox = []; }
    C.lastUser = r.user.uid; persist();
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(r)); localStorage.removeItem("mytrip-me"); } catch(_){}
    setSession(r); S.loggingIn = false;
    afterLogin();
  } catch(e){ S.loggingIn = false; S.loginErr = e && e.code === "offline" ? "ไม่มีอินเทอร์เน็ต ลองใหม่อีกครั้ง" : "เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง"; render(); }
}
function afterLogin(){
  flush(); refreshTrips();
  const code = S.pendingJoin, add = S.pendingAdd; S.pendingJoin = null; S.pendingAdd = "";
  if(code) startJoin(code);
  else if(add){ go("home"); waitTrips(() => addFromLink(add)); }
  else go("home");
}
/* run once the trip list has loaded (it comes from the phone first, then the server) */
function waitTrips(fn, tries = 0){
  if((S.trips && S.trips.length) || tries > 40) return fn();
  setTimeout(() => waitTrips(fn, tries + 1), 150);
}
function needLogin(){
  if(S.view === "login") return;
  try { localStorage.removeItem(SESSION_KEY); } catch(_){}
  setSession(null); go("login");
}
async function logout(){
  try { await api("logout"); } catch(_){}
  try { localStorage.removeItem(SESSION_KEY); } catch(_){}
  try { google.accounts.id.disableAutoSelect(); } catch(_){}
  C.trips = {}; C.items = {}; C.myTrips = []; C.outbox = []; C.lastUser = null; persist();
  setSession(null); S.trips = []; go("login");
}

/* ---------- boot ---------- */
/* phones keep an old copy of the page; reload once when a newer one is online */
const BUILD = "2026-11-10-wallet9";
async function checkUpdate(){
  if(location.protocol !== "https:") return;
  try {
    const html = await (await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"})).text();
    const live = (html.match(/const BUILD = "([^"]+)"/) || [])[1];
    if(live && live !== BUILD && sessionStorage.getItem("mytrip-reloaded") !== live && !busyForm() && !(S.upload && S.upload.status === "reading")){
      sessionStorage.setItem("mytrip-reloaded", live);
      location.reload();
    }
  } catch(_){}
}
(() => {
  let sess = null; try { sess = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(_){}
  setSession(sess && sess.token ? sess : null);
  unsubTrips = store.watchMyTrips(list => { S.trips = list; if(S.view === "home") softRender(); });
  const refresh = () => { checkUpdate(); if(!S.token) return; flush(); if(S.view !== "home" && S.tripId && !busyForm()) refreshTrip(S.tripId); else if(S.view === "home") refreshTrips(); };
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); });
  window.addEventListener("online", () => {updateSync();flush();docsPrefetchSoon();wxLoad();});
  // keep the app itself on the phone so it opens without internet
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("offline", updateSync);
  setInterval(refresh, 60000);
  flush();
  checkUpdate();
  const m = (location.hash || "").match(/^#join-([A-Za-z0-9]{6})$/);
  let add = "", shareInNow = false; try { const q = new URLSearchParams(location.search); add = q.get("add") || ""; shareInNow = q.get("share-in") === "1"; if(q.has("share-in")) history.replaceState(null, "", location.pathname); } catch(_){}
  if(!add){ const h = (location.hash || "").match(/^#add=(.+)$/); if(h) try { add = decodeURIComponent(h[1]); } catch(_){} }
  const addUrl = (String(add).match(MAPS_LINK) || [])[0] || "";
  if(addUrl){ try { history.replaceState(null, "", location.pathname); } catch(_){} }
  // drop the invite part of the address straight away, so a refresh, bookmark or home-screen icon opens the trip list
  if(location.hash){ try { history.replaceState(null, "", location.pathname); } catch(_){} }
  if(!S.token){ S.pendingJoin = m ? m[1] : null; S.pendingAdd = addUrl; go("login"); return; }
  if(m) startJoin(m[1]);
  else if(shareInNow){ go("home"); shareIn(); }
  else if(addUrl){ go("home"); waitTrips(() => addFromLink(addUrl)); }
  else go("home");
})();
})();
